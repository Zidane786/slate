<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="slate-version" content="0.2.2" />
<link rel="icon" href="data:," />
<title>Slate board</title>
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --panel-2: #eef0f4;
  --border: #d8dce4;
  --border-strong: #bcc3ce;
  --text: #14181f;
  --muted: #5c6675;
  --faint: #8a93a1;
  --accent: #2f6df6;
  --accent-soft: #e4ecfe;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .06);
  --p0: #d92d20; --p0-bg: #fde8e6;
  --p1: #b54708; --p1-bg: #fdf0e3;
  --p2: #175cd3; --p2-bg: #e6eefc;
  --p3: #5c6675; --p3-bg: #eceef2;
  --ok: #067647; --ok-bg: #e3f5ec;
  --warn: #b42318; --warn-bg: #fdeceb;
  --amber: #93370d; --amber-bg: #fef0c7; --amber-border: #f5b547;
  --story-bg: #f3f6fd;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1d232c;
    --border: #2a323d;
    --border-strong: #3b4552;
    --text: #e6e9ee;
    --muted: #9aa4b2;
    --faint: #6f7987;
    --accent: #5b8cff;
    --accent-soft: #1b2740;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    --p0: #ff8a80; --p0-bg: #3a1d1b;
    --p1: #f0a860; --p1-bg: #3a2a17;
    --p2: #8ab0ff; --p2-bg: #17243d;
    --p3: #9aa4b2; --p3-bg: #232a33;
    --ok: #6fd39b; --ok-bg: #14301f;
    --warn: #ff8a80; --warn-bg: #3a1d1b;
    --amber: #fbc96b; --amber-bg: #3a2c10; --amber-border: #a7741c;
    --story-bg: #172030;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116;
  --panel: #161b22;
  --panel-2: #1d232c;
  --border: #2a323d;
  --border-strong: #3b4552;
  --text: #e6e9ee;
  --muted: #9aa4b2;
  --faint: #6f7987;
  --accent: #5b8cff;
  --accent-soft: #1b2740;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  --p0: #ff8a80; --p0-bg: #3a1d1b;
  --p1: #f0a860; --p1-bg: #3a2a17;
  --p2: #8ab0ff; --p2-bg: #17243d;
  --p3: #9aa4b2; --p3-bg: #232a33;
  --ok: #6fd39b; --ok-bg: #14301f;
  --warn: #ff8a80; --warn-bg: #3a1d1b;
  --amber: #fbc96b; --amber-bg: #3a2c10; --amber-border: #a7741c;
  --story-bg: #172030;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
a { color: var(--accent); }

/* ---------- header ---------- */
header {
  position: sticky; top: 0; z-index: 40;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.hrow {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 14px;
}
.hrow + .hrow { border-top: 1px solid var(--border); }
.brand { font-size: 15px; font-weight: 650; letter-spacing: -.01em; margin-right: 2px; }
.brand small { font-weight: 400; color: var(--faint); font-size: 11px; margin-left: 6px; }
.counts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill {
  border: 1px solid var(--border); background: var(--panel-2);
  border-radius: 999px; padding: 2px 9px; font-size: 11.5px; color: var(--muted);
  white-space: nowrap;
}
.pill b { color: var(--text); font-weight: 650; }
button.pill.needs { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
button.pill.needs b { color: var(--amber); }
.spacer { flex: 1 1 auto; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button {
  background: var(--panel); border: 0; padding: 5px 11px; color: var(--muted); font-size: 12.5px;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.btn {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 5px 10px; font-size: 12.5px; color: var(--text);
}
.btn:hover:not(:disabled) { border-color: var(--border-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.subtle { color: var(--muted); }
.search {
  flex: 0 1 260px; min-width: 150px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 5px 9px;
}
.search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
label.inline { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }

/* ---------- status banners (compact, click to expand) ---------- */
#bannerHost { display: flex; flex-direction: column; gap: 6px; margin: 8px 14px 0; }
#bannerHost:empty { display: none; }
.banner {
  padding: 5px 12px; border-radius: 8px; font-size: 12.5px;
  border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--text);
}
.banner > summary {
  list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: baseline;
  white-space: nowrap; overflow: hidden; min-width: 0;
}
.banner > summary::-webkit-details-marker { display: none; }
.banner strong { color: var(--accent); flex: none; }
.banner .bact { color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.banner .bmore { margin-left: auto; color: var(--faint); font-size: 11.5px; flex: none; }
.banner .bmore::after { content: " \25B8"; }
.banner[open] .bmore::after { content: " \25BE"; }
.banner .bbody { color: var(--muted); padding: 4px 0 2px; }
/* ---------- filter dropdowns ---------- */
.fd { position: relative; }
.fd > summary {
  list-style: none; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); padding: 5px 10px; font-size: 12.5px; cursor: pointer; user-select: none;
}
.fd > summary::-webkit-details-marker { display: none; }
.fd[open] > summary { border-color: var(--accent); color: var(--accent); }
.fd .count { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 10.5px; }
.fd .menu {
  position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; min-width: 176px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 6px; max-height: 320px; overflow: auto;
}
.fd .menu label {
  display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 5px; font-size: 12.5px;
  cursor: pointer;
}
.fd .menu label:hover { background: var(--panel-2); }
.fd .menu .dim { color: var(--faint); margin-left: auto; font-size: 11px; }

/* ---------- badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 5px; padding: 1px 6px; font-size: 10.5px; font-weight: 600;
  border: 1px solid transparent; white-space: nowrap;
}
.b-phase { background: var(--panel-2); color: var(--muted); border-color: var(--border); }
.b-area  { background: transparent; color: var(--muted); border-color: var(--border); font-weight: 500; }
.b-prio { border-color: currentColor; }
.prio-P0 { color: var(--p0); background: var(--p0-bg); }
.prio-P1 { color: var(--p1); background: var(--p1-bg); }
.prio-P2 { color: var(--p2); background: var(--p2-bg); }
.prio-P3 { color: var(--p3); background: var(--p3-bg); }
.b-blocked { background: var(--warn-bg); color: var(--warn); border-color: currentColor; }
.b-ready { background: var(--ok-bg); color: var(--ok); border-color: currentColor; }
.b-needs { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
.b-draft { background: var(--panel-2); color: var(--muted); border-color: var(--border-strong); border-style: dashed; }
.b-preview { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); border-style: dashed; }
.b-fail { background: var(--warn-bg); color: var(--warn); border-color: currentColor; }
.rank { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

/* ---------- board ---------- */
main { padding: 12px 14px 24px; }
.board { display: flex; gap: 10px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
.col {
  flex: 1 0 205px; min-width: 205px; max-width: 400px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
  display: flex; flex-direction: column; max-height: calc(100vh - 170px);
}
.col.drop { border-color: var(--accent); background: var(--accent-soft); }
.col > h2 {
  margin: 0; padding: 9px 11px; font-size: 12px; font-weight: 650; letter-spacing: .02em;
  text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--border);
}
.col > h2 .n { margin-left: auto; color: var(--faint); font-weight: 500; }
.col.role-user_testing > h2 { color: var(--amber); }
.col.role-merge_ready > h2 { color: var(--accent); }
.col.role-done > h2 { color: var(--ok); }
.col .stack { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 9px; box-shadow: var(--shadow); cursor: pointer; min-width: 0;
}
.card:hover { border-color: var(--border-strong); }
.card.dragging { opacity: .45; }
.card.is-blocked { border-left: 3px solid var(--warn); }
.card.is-draft { background: var(--panel-2); box-shadow: none; }
.card.is-draft .title, .card.is-draft .summary { color: var(--muted); }
.card.needs-you { border-left: 3px solid var(--amber-border); }
.card.is-preview { border: 1.5px dashed var(--accent); box-shadow: none; }
.card .top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.card .cid { font-size: 11px; font-weight: 650; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.card .title { font-size: 12.8px; font-weight: 550; line-height: 1.35; margin-bottom: 3px; }
.card .summary {
  font-size: 12px; color: var(--muted); margin-bottom: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card .meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
.card .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.card .foot { display: flex; gap: 8px; align-items: center; margin-top: 6px; color: var(--faint); font-size: 11px; flex-wrap: wrap; }
.empty { color: var(--faint); font-size: 12px; padding: 10px; text-align: center; }

/* ---------- order view ---------- */
.phase { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.phase.is-preview { border: 1.5px dashed var(--accent); }
.phase > header { position: static; border: 0; border-bottom: 1px solid var(--border); background: var(--panel-2); padding: 10px 12px; }
.phase h2 { margin: 0 0 2px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.phase > header.toggle { cursor: pointer; }
.phase > header.toggle:hover { background: var(--panel); }
.phase .caret { display: inline-block; width: 12px; color: var(--faint); font-size: 11px; transition: transform .12s; }
.phase.open .caret { transform: rotate(90deg); }
.phase.collapsed > header { border-bottom: 0; }
.phase.is-empty { opacity: .75; }
.phase.is-unsched { border-style: dashed; }
.phase .note { color: var(--faint); font-size: 11.5px; font-weight: 400; }
.phase .goal { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
.phase .demo { color: var(--faint); font-size: 11.5px; margin: 3px 0 0; }
.bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.rows { display: block; }
.row {
  display: grid; grid-template-columns: 40px 82px minmax(160px, 1fr) auto auto auto auto;
  gap: 8px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--border);
  cursor: pointer;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--panel-2); }
.row.muted { opacity: .55; }
.row.is-preview { border-left: 3px dashed var(--accent); }
.row .rid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.row .rtitle { font-size: 12.8px; min-width: 0; }
.row .rtitle .rsum { display: block; color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .deps { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  border-radius: 999px; padding: 1px 7px; font-size: 10.5px; cursor: pointer;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.done { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.chip.open { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.chip.pv { border-style: dashed; }
a.chip { text-decoration: none; display: inline-flex; align-items: center; }
.chip.bug { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); cursor: default; font-weight: 600; }
.chip.fix { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
.b-merge { background: var(--accent-soft); color: var(--accent); border-color: currentColor; }
.b-unsched { background: transparent; color: var(--muted); border-color: var(--border-strong); border-style: dashed; }
.b-bug { background: var(--warn-bg); color: var(--warn); border-color: currentColor; }
select.status {
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: 3px 6px; font-size: 11.5px;
}

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); z-index: 70; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); z-index: 80;
  background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0, 0, 0, .18);
}
.drawer > header { position: static; border: 0; border-bottom: 1px solid var(--border); padding: 12px 24px 14px; background: var(--panel); }
.drawer .dtop { display: flex; align-items: center; gap: 8px; }
.drawer .dtop .cid { font-size: 12px; font-weight: 650; color: var(--muted); }
.drawer h2 { margin: 8px 0 10px; font-size: 20px; line-height: 1.3; letter-spacing: -.01em; }
.drawer .dmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.drawer .dmeta .sep { color: var(--border-strong); }
.drawer .dbody { overflow-y: auto; overflow-x: hidden; padding: 8px 24px 40px; min-width: 0; }
.notice {
  margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5;
  background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
}
.notice.pv { border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--text); }
.notice.dr { border-style: dashed; border-color: var(--border-strong); }
.notice b { color: var(--text); }
.dsect { margin-top: 26px; min-width: 0; }
.dsect > h3 {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 14px; font-weight: 650; color: var(--text); letter-spacing: -.005em;
  margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.dsect > h3 .hint { font-size: 12px; font-weight: 500; color: var(--faint); }
.dsect > h3 .spacer { flex: 1; }
.prose { font-size: 14px; line-height: 1.65; max-width: 70ch; min-width: 0; }
.lead { font-size: 15.5px; line-height: 1.6; margin: 0; max-width: 66ch; }
.story {
  margin: 0; padding: 12px 16px; background: var(--story-bg);
  border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
  font-size: 14px; line-height: 1.65; max-width: 70ch;
}
.story p:last-child { margin-bottom: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 14px; line-height: 1.5; max-width: 70ch; cursor: pointer; }
.check input { margin-top: 4px; flex: none; }
.check.on .ctext > span { color: var(--faint); text-decoration: line-through; }
.check .ctext { min-width: 0; }
.check .ev { font-size: 12px; color: var(--ok); margin-top: 1px; overflow-wrap: anywhere; }
.check input:disabled { cursor: default; }
.subhead { font-size: 12px; font-weight: 600; color: var(--faint); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.subhead:first-child { margin-top: 0; }
.plain { font-size: 13.5px; color: var(--muted); }

/* markdown */
.md-h { margin: 18px 0 6px; line-height: 1.35; }
.md-h1 { font-size: 16px; }
.md-h2 { font-size: 15px; }
.md-h3 { font-size: 14px; }
.md-h4 { font-size: 13.5px; color: var(--muted); }
.prose > :first-child, .story > :first-child { margin-top: 0; }
.md-p { margin: 0 0 10px; }
.md-ul, .md-ol { margin: 0 0 10px; padding-left: 22px; }
.md-ul li, .md-ol li { margin: 3px 0; }
.md-code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 12.5px; }
.md-pre {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; margin: 0 0 12px;
  font-size: 12.5px; line-height: 1.45;
  white-space: pre; overflow-x: auto; overflow-wrap: normal; word-break: normal;
  max-width: 100%; tab-size: 4;
}
.md-pre code { background: none; border: 0; padding: 0; white-space: pre; font-size: inherit; }
.md-quote {
  margin: 0 0 12px; padding: 6px 14px; border-left: 3px solid var(--border-strong);
  color: var(--muted); background: var(--panel-2); border-radius: 0 6px 6px 0;
}
.md-quote > :last-child { margin-bottom: 0; }
.md-table-wrap { overflow-x: auto; margin: 0 0 12px; max-width: 100%; }
.md-table { border-collapse: collapse; font-size: 13px; line-height: 1.45; }
.md-table th, .md-table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
.md-table th { background: var(--panel-2); font-weight: 650; }

/* user tests */
.ut { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; background: var(--panel); }
.ut.passed { border-color: var(--ok); }
.ut.failed { border-color: var(--warn); }
.ut-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ut-title { font-size: 14.5px; font-weight: 650; }
.ut-num { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.ut .body { font-size: 14px; line-height: 1.6; max-width: 70ch; }
.ut ol { margin: 0; padding-left: 22px; }
.ut ol li { margin: 3px 0; }
.ut .expect { background: var(--ok-bg); color: var(--text); border-radius: 6px; padding: 8px 10px; }
.ut .recorded { margin-top: 12px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ut .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.ut .actions .plain { font-size: 12px; }
.btn.pass[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); font-weight: 650; }
.btn.fail[aria-pressed="true"] { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); font-weight: 650; }

/* technical */
details.tech { border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
details.tech > summary { cursor: pointer; padding: 9px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
details.tech[open] > summary { border-bottom: 1px solid var(--border); }
details.tech .prose { padding: 12px 14px 4px; }

/* links row */
.links { display: grid; grid-template-columns: 70px 1fr; gap: 8px 12px; align-items: center; font-size: 13px; }
.links dt { color: var(--faint); }
.links dd { margin: 0; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.path { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; font-size: 12.5px; word-break: break-all; }

/* history timeline */
.tl { list-style: none; margin: 0; padding: 0 0 0 4px; }
.tl li { position: relative; padding: 0 0 16px 20px; border-left: 2px solid var(--border); }
.tl li:last-child { border-left-color: transparent; }
.tl li::before {
  content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--accent);
}
.tl li:last-child::before { background: var(--accent); }
.tl .when { font-size: 12px; color: var(--faint); display: flex; gap: 8px; align-items: center; margin-bottom: 3px; }
.tl .note { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 70ch; }

/* code changes (commits + pull request) */
.b-pr { background: transparent; color: var(--accent); border-color: var(--accent); }
.pr-draft { background: var(--panel-2); color: var(--muted); border-color: var(--border-strong); }
.pr-open { background: var(--ok-bg); color: var(--ok); border-color: currentColor; }
.pr-merged { background: var(--accent-soft); color: var(--accent); border-color: currentColor; }
.pr-closed { background: var(--warn-bg); color: var(--warn); border-color: currentColor; }
.prline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 10px; min-width: 0; }
.prline .lbl { color: var(--faint); font-size: 12px; font-weight: 600; }
.prline a { overflow-wrap: anywhere; }
.commits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.commits li { display: flex; gap: 10px; align-items: baseline; font-size: 13px; min-width: 0; }
.commits .sha {
  flex: none; font-size: 12px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 5px; padding: 1px 6px; color: var(--text); text-decoration: none;
}
.commits a.sha:hover { border-color: var(--accent); color: var(--accent); }
.commits .msg { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.commits .cdate { flex: none; color: var(--faint); font-size: 12px; }
.nocode { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* ---------- loader panel ---------- */
.loader {
  max-width: 560px; margin: 60px auto; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px; box-shadow: var(--shadow);
}
.loader h2 { margin: 0 0 8px; font-size: 15px; }
.loader p { color: var(--muted); margin: 0 0 10px; }
.loader code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.err { color: var(--warn); font-size: 12px; }

/* ---------- "Board updated" note ---------- */
.toast {
  position: fixed; left: 14px; bottom: 14px; z-index: 110;
  background: var(--panel); color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 8px; padding: 6px 12px; font-size: 12.5px; box-shadow: var(--shadow);
}

/* ---------- footer ---------- */
footer.site { padding: 6px 14px 20px; color: var(--faint); font-size: 11.5px; text-align: center; }

/* ---------- live / view-only mode ---------- */
.pill.mode { font-weight: 600; }
.pill.mode.live { background: var(--ok-bg); color: var(--ok); border-color: currentColor; }
.pill.mode.view { background: var(--panel-2); color: var(--muted); border-style: dashed; font-weight: 500; }
.pill.mode code { font-size: 11px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--text); }
.pill.local-n { border-style: dotted; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.pill.local-n b { color: var(--accent); }
.tag-local {
  display: inline-flex; align-items: center; border: 1px dotted var(--accent); color: var(--accent);
  background: var(--accent-soft); border-radius: 5px; padding: 0 5px; font-size: 10.5px; font-weight: 600;
  white-space: nowrap; margin-left: 6px; vertical-align: 1px;
}
.card.is-local { outline: 2px dotted var(--accent); outline-offset: 1px; }
.row.is-local { outline: 2px dotted var(--accent); outline-offset: -2px; }
.check.local .ctext > span:first-child { border-bottom: 1px dotted var(--accent); }
.check.on .ctext > span.tag-local { text-decoration: none; color: var(--accent); }
.ut.local { border-style: dotted; border-width: 2px; }
.chip.claim { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); cursor: default; font-weight: 600; }
.col.no-drop { opacity: .5; }
.col.no-drop.drop { border-color: var(--warn); background: var(--warn-bg); opacity: .8; }
select.status option:disabled { color: var(--faint); }
.claimline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.claimline b { color: var(--text); }
.notebox textarea, .modal textarea, .modal input[type="text"], .ut .utnote {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 9px; font: inherit; color: var(--text);
}
.notebox textarea { min-height: 64px; resize: vertical; max-width: 70ch; display: block; }
.row2 { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.ut .utnote { max-width: 360px; width: auto; flex: 1 1 200px; padding: 5px 8px; font-size: 12.5px; }
.via { font-size: 11px; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }

/* banners (unlock, doctor, version, server) */
.banner.warn { border: 1.5px solid var(--amber-border); background: var(--amber-bg); }
.banner.warn strong { color: var(--amber); }
.banner.bad { border: 1.5px solid var(--warn); background: var(--warn-bg); }
.banner.bad strong { color: var(--warn); }
.banner ul { margin: 4px 0 0; padding-left: 18px; width: 100%; color: var(--muted); font-size: 12.5px; }
.banner code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 12px; }

/* modal (handoff prompt, refusals, removed tickets, board history, commands) */
.modal-scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .5); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; overflow-y: auto; }
.modal {
  background: var(--panel); color: var(--text); border: 1px solid var(--border-strong); border-radius: 12px;
  box-shadow: var(--shadow); width: min(620px, 100%); padding: 18px 20px; min-width: 0;
}
.modal h3 { margin: 0 0 8px; font-size: 16px; }
.modal p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.modal .mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.modal textarea { min-height: 90px; resize: vertical; }
.modal .errlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.modal .errlist li { border-left: 3px solid var(--warn); padding: 2px 0 2px 10px; font-size: 13.5px; }
.modal .errlist .what { color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.modal .fixes { margin: 6px 0 0; padding: 0; list-style: none; }
.modal .fixes li { border: 0; padding: 2px 0; }
.modal .fixes code, .modal pre {
  display: block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 9px; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.modal pre { max-height: 50vh; overflow: auto; margin: 0; }
.modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
.modal th, .modal td { border-bottom: 1px solid var(--border); padding: 6px 6px; text-align: left; vertical-align: top; }
.modal th { color: var(--faint); font-weight: 600; font-size: 12px; }
.modal .hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

@media (max-width: 720px) {
  .drawer { width: 100%; border-left: 0; }
  .drawer > header, .drawer .dbody { padding-left: 16px; padding-right: 16px; }
  .row { grid-template-columns: 34px 76px 1fr; row-gap: 4px; }
  .row .deps, .row .rprio, .row .rareas { grid-column: 1 / -1; }
  .col { max-height: none; }
}
</style>

<body>

<header>
  <div class="hrow">
    <div class="brand"><span id="brandName">Slate board</span> <small id="gen"></small></div>
    <div class="counts" id="counts"></div>
    <span class="pill mode view" id="modePill">View only</span>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="View">
      <button id="viewBoard" aria-pressed="true">Board</button>
      <button id="viewOrder" aria-pressed="false">Implementation order</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search id, title, text, labels  ( / )" aria-label="Search" />
    <button class="btn subtle" id="themeBtn" title="Toggle theme">Theme: auto</button>
  </div>
  <div class="hrow">
    <details class="fd" id="fdPhase"><summary>Phase <span class="count" hidden>0</span></summary><div class="menu"></div></details>
    <details class="fd" id="fdArea"><summary>Area <span class="count" hidden>0</span></summary><div class="menu"></div></details>
    <details class="fd" id="fdPrio"><summary>Priority <span class="count" hidden>0</span></summary><div class="menu"></div></details>
    <details class="fd" id="fdStatus"><summary>Status <span class="count" hidden>0</span></summary><div class="menu"></div></details>
    <label class="inline"><input type="checkbox" id="fReady" /> Ready to start only</label>
    <label class="inline"><input type="checkbox" id="fHideDone" /> Hide done</label>
    <label class="inline" id="sortWrap">Sort
      <select id="sort" class="status">
        <option value="rank">rank</option>
        <option value="priority">priority</option>
        <option value="id">id</option>
      </select>
    </label>
    <button class="btn subtle" id="clearFilters" hidden>Clear filters (<span id="fcount">0</span>)</button>
    <button class="btn subtle" id="removedBtn" hidden>Removed (0)</button>
    <button class="btn subtle" id="historyBtn" hidden>Board history</button>
    <span class="spacer"></span>
    <span class="pill" id="dirty">0 local changes</span>
    <button class="btn" id="copyCmdsBtn" hidden>Copy as board.py commands</button>
    <button class="btn" id="exportBtn">Export tickets.json</button>
    <button class="btn subtle" id="resetBtn">Reset local changes</button>
  </div>
</header>

<div id="bannerHost"></div>
<main id="main"></main>
<footer class="site" id="siteFoot">Slate v0.2.2</footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div id="drawerHost"></div>
<div id="modalHost"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Slate board. Vanilla JS, no dependencies.
 * Loaded ticket data is never mutated. All local edits live in an
 * overlay object persisted to localStorage and keyed by ticket id.
 * kanban/preview.json (when present) is shown for display only: it is
 * never exported and never written to the overlay.
 * ------------------------------------------------------------------ */

var SLATE_VERSION = "0.2.2";
var POLL_FAST_MS = 5000;        // while things change or the viewer is active
var POLL_SLOW_MS = 30000;       // after IDLE_MS without a change or an interaction
var IDLE_MS = 180000;
var SAFETY_MS = 30000;          // full fetch + content compare, whatever Last-Modified says
var BOARD_CMD = "python3 kanban/board.py";
var NAME_KEY = "slate.claim.name";
var HANDOFF_PLACEHOLDER = "<note for the ticket's history>";
var THEME_KEY = "slate.theme";
var OVERLAY_KEY = "slate.board.overlay.v1";   // replaced in boot() with slate.<prefix>.overlay.v1
var DEFAULT_STATUSES = ["draft", "backlog", "ready", "in_progress", "review", "user_testing", "merge_ready", "done"];
var DEFAULT_USER_TEST_AREAS = ["frontend", "ui"];
// Every status has a role (one of the built-in names); behaviour keys off roles, never names.
var ROLES = DEFAULT_STATUSES;
var HANDOFF_ROLES = ["review", "user_testing", "merge_ready", "done"];
var STATUS_LABELS = {
  draft: "Draft", backlog: "Backlog", ready: "Ready", in_progress: "In Progress",
  review: "Review", user_testing: "User testing", merge_ready: "Waiting for merge", done: "Done",
  blocked: "Blocked"
};

var state = {
  raw: null,          // exact parsed tickets.json, never mutated
  previewRaw: null,   // parsed preview.json when present
  previewCount: 0,
  tickets: [],        // normalised copies (unlocks filled in), preview tickets included
  byId: {},
  phases: [],
  filterPhases: [],
  statuses: [],
  areas: [],
  priorities: [],
  userTestAreas: DEFAULT_USER_TEST_AREAS.slice(),
  repoUrl: "",
  overlay: {},
  view: "board",
  sort: "rank",
  search: "",
  filters: { phase: [], area: [], priority: [], status: [] },
  readyOnly: false,
  hideDone: false,
  openId: null,
  techOpen: {},
  phaseOpen: {},      // phase id -> true/false once the viewer toggles it (implementation view)
  source: null,       // "fetch" (served folder, polled) or "file" (file picker, not polled)
  lastSig: null,      // tickets.json + preview.json text last shown, to spot changes
  lastText: { t: null, p: null },
  lastMod: {},        // url -> Last-Modified of the response last shown (for If-Modified-Since)
  lastFull: 0,        // time of the last full (unconditional) fetch
  lastActivity: 0,    // last change seen or viewer interaction (drives the 5 s / 30 s poll)
  pollTimer: null,
  polling: false,
  statusLabels: {},   // meta.status_labels
  statusRoles: {},    // meta.status_roles
  statusFrom: {},     // meta.status_from (path rules)
  live: null,         // /api/info answer when served by `board.py serve`, else null (view only)
  token: "",
  infoFails: 0,
  allowed: {},        // id -> { allowed: [...], reasons: {status: text} } from /api/allowed (live)
  unlockFile: null,   // view only: kanban/.slate-unlock.json when it is active
  saving: false
};

/* ---------------- helpers ---------------- */

function $(sel, root) { return (root || document).querySelector(sel); }

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}

function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function titleCase(s) { return s.replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); }); }
function labelStatus(s) {
  var l = state.statusLabels[s];
  if (typeof l === "string" && l.trim()) return l;
  return STATUS_LABELS[s] || titleCase(String(s || "").replace(/_/g, " "));
}
// meta.status_roles wins; a built-in status name is its own role; other statuses have none.
function roleOf(s) {
  var r = state.statusRoles[s];
  if (ROLES.indexOf(r) !== -1) return r;
  return ROLES.indexOf(s) !== -1 ? s : null;
}
function statusesWithRole(r) { return state.statuses.filter(function (s) { return roleOf(s) === r; }); }
function useOverlay() { return !state.live; }

function loadOverlay() {
  try {
    var v = JSON.parse(localStorage.getItem(OVERLAY_KEY) || "{}");
    return (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
  } catch (e) { return {}; }
}

function saveOverlay() {
  try { localStorage.setItem(OVERLAY_KEY, JSON.stringify(state.overlay)); } catch (e) { /* private mode */ }
}

function entry(id) {
  if (!state.overlay[id]) state.overlay[id] = {};
  return state.overlay[id];
}

function tidyEntry(id) {
  var e = state.overlay[id];
  if (!e) return;
  if (e.checks && !Object.keys(e.checks).length) delete e.checks;
  if (!Object.keys(e).length) delete state.overlay[id];
}

function isPreview(t) { return !!(t && t._preview); }
function isLegacy(t) { return !t.summary && !t.story; }

function statusOf(t) {
  if (isPreview(t) || !useOverlay()) return t.status;
  var o = state.overlay[t.id];
  return (o && o.status) ? o.status : t.status;
}
function roleNow(t) { return t ? roleOf(statusOf(t)) : null; }
function isDone(t) { return roleNow(t) === "done"; }
function isDraft(t) { return roleNow(t) === "draft"; }
function needsYou(t) { return roleNow(t) === "user_testing"; }
function isMergeReady(t) { return roleNow(t) === "merge_ready"; }
function isInProgress(t) { return roleNow(t) === "in_progress"; }
// A status change kept only in this browser (view-only mode).
function localStatus(t) {
  if (!t || isPreview(t) || !useOverlay()) return null;
  var o = state.overlay[t.id];
  return (o && o.status && o.status !== t.status) ? o.status : null;
}
// Unscheduled phases hold "someday" tickets: next/list never offer them.
function isUnscheduledPhase(pid) {
  var p = phaseById(pid);
  return !!(p && p.unscheduled === true);
}
function isUnscheduled(t) { return !!t && isUnscheduledPhase(t.phase); }
function openDeps(t) {
  return (t.depends_on || []).filter(function (d) {
    var dep = state.byId[d];
    return !dep || !isDone(dep);
  });
}
function isBlocked(t) { return openDeps(t).length > 0; }
// Ready = saved ticket in backlog/ready with every dependency done.
function isReady(t) {
  if (isPreview(t) || isUnscheduled(t)) return false;
  var r = roleNow(t);
  return (r === "backlog" || r === "ready") && !isBlocked(t);
}

function checkKey(kind, i) { return kind + ":" + i; }
// A tick saved on the board (item_checks, written by board.py check-item) wins over the
// browser overlay. Every item of a ticket that is done in the file counts as ticked.
function fileItemCheck(t, kind, i) {
  if (!t || isPreview(t)) return null;
  var ic = t.item_checks;
  if (ic && typeof ic === "object" && !Array.isArray(ic)) {
    var r = ic[checkKey(kind, i)];
    if (r && typeof r === "object") return r;
    if (r === true) return {};
  }
  if (roleOf(t.status) === "done") return { done: true };
  return null;
}
function isTicked(t, kind, i) { return !!fileItemCheck(t, kind, i) || checked(t.id, kind, i); }
function checked(id, kind, i) {
  if (!useOverlay()) return false;
  var o = state.overlay[id];
  return !!(o && o.checks && o.checks[checkKey(kind, i)]);
}
function setChecked(id, kind, i, on) {
  if (isPreview(state.byId[id])) return;
  var e = entry(id);
  if (!e.checks) e.checks = {};
  if (on) e.checks[checkKey(kind, i)] = true;
  else delete e.checks[checkKey(kind, i)];
  tidyEntry(id);
  saveOverlay();
}

/* Local Pass/Fail clicks: overlay checks["usertest:<i>"] = "pass" | "fail" | "reset" (clear a recorded result). */
function localUserTest(id, i) {
  if (!useOverlay()) return null;
  var o = state.overlay[id];
  var v = o && o.checks && o.checks[checkKey("usertest", i)];
  return (v === "pass" || v === "fail" || v === "reset") ? v : null;
}
function setUserTest(id, i, result) {
  if (isPreview(state.byId[id])) return;
  var e = entry(id);
  if (!e.checks) e.checks = {};
  var k = checkKey("usertest", i);
  if (e.checks[k] === result) delete e.checks[k]; else e.checks[k] = result;
  tidyEntry(id);
  saveOverlay();
}
function recordedUserTest(t, i) {
  var uc = t.user_checks;
  if (!uc || typeof uc !== "object") return null;
  var r = uc[String(i)];
  return (r && typeof r === "object") ? r : null;
}

// Is this local overlay mark already true in tickets.json? Then it is not a pending change.
function markInFile(t, key, value) {
  var m = /^(acceptance|test):(\d+)$/.exec(key);
  if (m) return !!fileItemCheck(t, m[1], Number(m[2]));
  var u = /^usertest:(\d+)$/.exec(key);
  if (u) {
    var rec = recordedUserTest(t, Number(u[1]));
    var res = rec && rec.result;
    return value === "reset" ? !res : res === value;
  }
  return false;
}

// Drop local marks the file already reflects (someone ran the board.py command).
function pruneOverlay() {
  var changed = false;
  Object.keys(state.overlay).forEach(function (id) {
    var o = state.overlay[id], t = state.byId[id];
    if (!t || isPreview(t)) return;
    if (o.status && o.status === t.status) { delete o.status; changed = true; }
    if (o.checks) Object.keys(o.checks).forEach(function (k) {
      if (markInFile(t, k, o.checks[k])) { delete o.checks[k]; changed = true; }
    });
    tidyEntry(id);
  });
  if (changed) saveOverlay();
}

function changeCount() {
  if (!useOverlay()) return 0;
  var n = 0;
  Object.keys(state.overlay).forEach(function (id) {
    var o = state.overlay[id], t = state.byId[id];
    if (!t || isPreview(t)) return;
    if (o.status && o.status !== t.status) n++;
    if (o.checks) Object.keys(o.checks).forEach(function (k) {
      if (!markInFile(t, k, o.checks[k])) n++;
    });
  });
  return n;
}

/* ---------------- minimal markdown renderer ---------------- */

function mdInline(s) {
  var codes = [];
  s = s.replace(/`([^`]+)`/g, function (m, c) {
    codes.push(c);
    return "%%MDCODE" + (codes.length - 1) + "%%";
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, txt, url) {
    if (/^\s*(javascript|data|vbscript):/i.test(url)) return txt;
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + txt + "</a>";
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^\w*])\*([^\s*][^*]*?[^\s*]|[^\s*])\*(?=[^\w*]|$)/g, "$1<em>$2</em>");
  s = s.replace(/%%MDCODE(\d+)%%/g, function (m, i) {
    return '<code class="md-code">' + codes[Number(i)] + "</code>";
  });
  return s;
}

function splitRow(line) {
  var s = line.trim();
  if (s.charAt(0) === "|") s = s.slice(1);
  if (s.charAt(s.length - 1) === "|" && s.charAt(s.length - 2) !== "\\") s = s.slice(0, -1);
  var cells = [], cur = "";
  for (var i = 0; i < s.length; i++) {
    var ch = s.charAt(i);
    if (ch === "\\" && s.charAt(i + 1) === "|") { cur += "|"; i++; continue; }
    if (ch === "|") { cells.push(cur.trim()); cur = ""; continue; }
    cur += ch;

var TABLE_SEP = /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/;

function mdToHtml(src) {

  var out = [], i = 0;
  var isBullet = function (l) { return /^\s*[-*+]\s+/.test(l); };
  var isNum = function (l) { return /^\s*\d+[.)]\s+/.test(l); };
  var isHead = function (l) { return /^#{1,6}\s+/.test(l); };
  var isFence = function (l) { return /^\s*(```|~~~)/.test(l); };
  var isQuote = function (l) { return /^\s*>/.test(l); };
  var isTableAt = function (k) {
    return k + 1 < lines.length && /\|/.test(lines[k]) && TABLE_SEP.test(lines[k + 1]) && /-/.test(lines[k + 1]);

  while (i < lines.length) {
    var line = lines[i];

    if (isFence(line)) {
      var fence = line.trim().slice(0, 3);
      i++;

      while (i < lines.length && lines[i].trim().indexOf(fence) !== 0) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre class="md-pre"><code>' + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }

    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {

      i++;
      continue;
    }
    if (isTableAt(i)) {
      var head = splitRow(lines[i]);
      var aligns = splitRow(lines[i + 1]).map(function (c) {
        var l = c.charAt(0) === ":", r = c.charAt(c.length - 1) === ":";
        return (l && r) ? "center" : (r ? "right" : "");

      head.forEach(function (c, k) { html += "<th" + cellAttr(k) + ">" + mdInline(esc(c)) + "</th>"; });

        var cells = splitRow(lines[i]);
        html += "<tr>";
        for (var k = 0; k < head.length; k++) html += "<td" + cellAttr(k) + ">" + mdInline(esc(cells[k] || "")) + "</td>";
        html += "</tr>";
        i++;

      continue;
    }
    if (isQuote(line)) {
      var q = [];
      while (i < lines.length && isQuote(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push('<blockquote class="md-quote">' + mdToHtml(q.join("\n")) + "</blockquote>");
      continue;
    }
    if (isBullet(line)) {
      var ul = [];
      while (i < lines.length && isBullet(lines[i])) {
        ul.push("<li>" + mdInline(esc(lines[i].replace(/^\s*[-*+]\s+/, ""))) + "</li>");
        i++;
      }
      out.push('<ul class="md-ul">' + ul.join("") + "</ul>");
      continue;
    }
    if (isNum(line)) {
      var ol = [];
      while (i < lines.length && isNum(lines[i])) {
        ol.push("<li>" + mdInline(esc(lines[i].replace(/^\s*\d+[.)]\s+/, ""))) + "</li>");
        i++;
      }
      out.push('<ol class="md-ol">' + ol.join("") + "</ol>");
      continue;
    }
    var para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !isFence(lines[i]) && !isHead(lines[i])
           && !isBullet(lines[i]) && !isNum(lines[i]) && !isQuote(lines[i]) && !isTableAt(i)) {
      para.push(lines[i]);
      i++;
    }
    out.push('<p class="md-p">' + mdInline(esc(para.join(" "))) + "</p>");
  }
  return out.join("");
}

/* ---------------- data normalisation ---------------- */

function uniq(a) {
  var s = [];
  for (var i = 0; i < a.length; i++) if (a[i] && s.indexOf(a[i]) === -1) s.push(a[i]);

function normTicket(t, idx, preview) {
  var c = {};
  for (var k in t) if (Object.prototype.hasOwnProperty.call(t, k)) c[k] = t[k];
  c.id = String(c.id || ("?" + (idx + 1)));
  c.title = c.title || c.id;
  c.areas = arr(c.areas);
  c.labels = arr(c.labels);
  c.depends_on = arr(c.depends_on);
  c.acceptance = arr(c.acceptance);
  c.test_scenarios = arr(c.test_scenarios);
  c.user_tests = arr(c.user_tests);
  c.rank = (typeof c.rank === "number") ? c.rank : idx + 1;
  c.status = c.status || (preview ? "backlog" : state.statuses[0]);
  c.unlocksGiven = Array.isArray(t.unlocks);

  return c;
}

function normalise(data, preview) {
  state.raw = data;

  var meta = data.meta || {};
  state.statuses = (meta.statuses && meta.statuses.length) ? meta.statuses.slice() : DEFAULT_STATUSES.slice();
  var objOr = function (v) { return (v && typeof v === "object" && !Array.isArray(v)) ? v : {}; };
  state.statusLabels = objOr(meta.status_labels);
  state.statusRoles = objOr(meta.status_roles);
  state.statusFrom = objOr(meta.status_from);
  state.userTestAreas = Array.isArray(meta.user_test_areas) ? meta.user_test_areas.slice() : DEFAULT_USER_TEST_AREAS.slice();
  state.repoUrl = (typeof meta.repo_url === "string" && /^https?:\/\//i.test(meta.repo_url)) ? meta.repo_url : "";
  state.phases = arr(data.phases).map(function (p) { var c = {}; for (var k in p) c[k] = p[k]; return c; });

  state.tickets = arr(data.tickets).map(function (t, idx) { return normTicket(t, idx, false); });
  state.byId = {};
  state.tickets.forEach(function (t) { state.byId[t.id] = t; });

  // Preview tickets: display only. Ids that already exist in tickets.json win.
  state.previewCount = 0;
  if (preview) {
    var known = {};
    state.phases.forEach(function (p) { known[p.id] = true; });
    arr(preview.phases).forEach(function (p) {
      if (p && p.id && !known[p.id]) {
        var c = {}; for (var k in p) c[k] = p[k];
        c._preview = true;
        state.phases.push(c);
        known[p.id] = true;
      }
    });
    arr(preview.tickets).forEach(function (t, idx) {
      if (!t || !t.id || state.byId[t.id]) return;
      var c = normTicket(t, state.tickets.length + idx, true);
      state.tickets.push(c);
      state.byId[c.id] = c;
      state.previewCount++;

  }

  // Columns come from meta.statuses; a status used by a ticket but missing there still gets one.
  state.tickets.forEach(function (t) {
    var s = t.status;
    if (state.statuses.indexOf(s) !== -1) return;
    if (s === "draft") state.statuses.unshift(s);
    else if (s === "user_testing" && state.statuses.indexOf("merge_ready") !== -1) state.statuses.splice(state.statuses.indexOf("merge_ready"), 0, s);
    else if ((s === "user_testing" || s === "merge_ready") && state.statuses.indexOf("done") !== -1) state.statuses.splice(state.statuses.indexOf("done"), 0, s);
    else state.statuses.push(s);

  var derived = {};

  state.tickets.forEach(function (t) {

    .concat(state.tickets.map(function (t) { return t.priority; })).filter(Boolean));

function savedTickets() { return state.tickets.filter(function (t) { return !isPreview(t); }); }
function phaseById(id) { return state.phases.filter(function (p) { return p.id === id; })[0]; }

/* ---------------- filtering and sorting ---------------- */

function matchesSearch(t, q) {
  if (!q) return true;
  var hay = [t.id, t.title, t.summary, t.story, t.description, (t.labels || []).join(" ")]
    .join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

function passes(t) {
  var f = state.filters;
  if (!matchesSearch(t, state.search)) return false;
  if (f.phase.length && f.phase.indexOf(t.phase) === -1) return false;
  if (f.priority.length && f.priority.indexOf(t.priority) === -1) return false;
  if (f.status.length && f.status.indexOf(statusOf(t)) === -1) return false;
  if (f.area.length) {
    var hit = (t.areas || []).some(function (a) { return f.area.indexOf(a) !== -1; });
    if (!hit) return false;
  }
  if (state.readyOnly && !isReady(t)) return false;
  if (state.hideDone && isDone(t)) return false;
  return true;
}

function visible() { return state.tickets.filter(passes); }

function activeFilterCount() {
  var f = state.filters;
  return f.phase.length + f.area.length + f.priority.length + f.status.length
    + (state.readyOnly ? 1 : 0) + (state.hideDone ? 1 : 0);
}

function cmp(a, b) { return a < b ? -1 : (a > b ? 1 : 0); }

function sortTickets(list) {
  var mode = state.sort;
  var pIdx = function (t) {
    var i = state.priorities.indexOf(t.priority);
    return i === -1 ? 99 : i;
  };
  return list.slice().sort(function (a, b) {
    if (mode === "priority") return pIdx(a) - pIdx(b) || a.rank - b.rank || cmp(a.id, b.id);
    if (mode === "id") return cmp(a.id, b.id);
    return a.rank - b.rank || cmp(a.id, b.id);
  });
}

function byRank() {
  return state.tickets.slice().sort(function (a, b) { return a.rank - b.rank || cmp(a.id, b.id); });
}

/* ---------------- mutation: board API (live) or overlay (view only) ---------------- */

// Path rules from meta.status_from, checked in the browser for view-only mode (the server checks
// every gate in live mode). Only forward moves are restricted, as in board.py.
function localAllowed(t) {
  var cur = statusOf(t), sts = state.statuses, out = { allowed: [], reasons: {} };
  sts.forEach(function (s) {
    var from = state.statusFrom[s];
    var fwd = sts.indexOf(s) > sts.indexOf(cur);
    if (s !== cur && fwd && Array.isArray(from) && from.length && from.indexOf(cur) === -1) {
      out.reasons[s] = labelStatus(s) + " can only be reached from: " + from.map(labelStatus).join(", ");
    } else out.allowed.push(s);
  });
  return out;
}

// { allowed: [...], reasons: {...} } for a ticket, or null while not known yet (live mode).
function allowedFor(t) {
  if (!t || isPreview(t)) return null;
  if (!state.live) return localAllowed(t);
  var a = state.allowed[t.id];
  return (a && Array.isArray(a.allowed)) ? a : null;
}
function moveReason(t, st) {
  var a = allowedFor(t);
  if (!a || st === statusOf(t) || a.allowed.indexOf(st) !== -1) return null;
  return (a.reasons && a.reasons[st]) || ("Not allowed from " + labelStatus(statusOf(t)));
}

function setStatus(id, status) {
  var t = state.byId[id];
  if (!t || isPreview(t)) return;
  if (status === statusOf(t)) return;
  var why = moveReason(t, status);
  if (why) {
    showRefusal("Can't move " + id + " to " + labelStatus(status),
      { errors: [{ id: id, field: "status", message: why, fix: [] }] });
    renderKeepScroll();
    return;
  }
  if (state.live) { liveSetStatus(t, status); return; }
  var e = entry(id);
  if (status === t.status) delete e.status; else e.status = status;
  tidyEntry(id);
  saveOverlay();
  render();
}

// Does moving to this status need a note for the ticket's history? /api/info statuses may carry
// note: "required" | "optional"; without that, fall back to the built-in rule (review, user
// testing, waiting for merge and done roles need one).
function noteRequired(st) {
  var info = state.live && arr(state.live.statuses).filter(function (x) {
    return x && typeof x === "object" && x.name === st;
  })[0];
  if (info && (info.note === "required" || info.note === "optional")) return info.note === "required";
  return HANDOFF_ROLES.indexOf(roleOf(st)) !== -1;
}
function hasPathRules() {
  return Object.keys(state.statusFrom).some(function (k) { return arr(state.statusFrom[k]).length > 0; });
}

function isBackward(from, to) {
  var i = state.statuses.indexOf(from), j = state.statuses.indexOf(to);
  return i !== -1 && j !== -1 && j < i;
}

function needsHandoff(res) {
  if (!res) return false;
  if (res.code === "needs_handoff") return true;
  return arr(res.errors).some(function (e) { return e && e.code === "needs_handoff"; });
}

function liveSetStatus(t, status) {
  var from = t.status;
  var go = function (handoff) {
    var body = { id: t.id, status: status };
    if (handoff) body.handoff = handoff;
    return api("set", body).then(function (res) {
      if (res.ok) return afterSave("Saved: " + t.id + " → " + labelStatus(status), res);
      if (!handoff && needsHandoff(res)) return ask();
      refused("Can't move " + t.id + " to " + labelStatus(status), res);
    });
  };
  var ask = function () {
    var back = isBackward(from, status);
    return askText({
      title: t.id + " \u2192 " + labelStatus(status),
      message: back ? "Moving back to " + labelStatus(status) + " needs a short note for the ticket's history: why it's going back."
        : "Moving to " + labelStatus(status) + " needs a short note for the ticket's history: what was done, or why it moves on.",
      placeholder: "Note for the ticket's history", okLabel: "Move", multiline: true
    }).then(function (note) {
      if (note === null) { renderKeepScroll(); return; }
      return go(note);
    });
  };
  // Pre-open the note box when the target needs a note (from /api/info) or the move goes back;
  // otherwise try without one and ask only if the server answers needs_handoff.
  if (isBackward(from, status) || noteRequired(status)) ask(); else go("");
}

/* ---------------- board API (live mode: `board.py serve`) ---------------- */

// POST ./api/<path> with the per-run token. Always resolves to the parsed answer:
// { ok: true, ... } or { ok: false, code?, errors: [{ id, field, message, fix: [...] }] }.
// Every write carries the viewer's saved name ("as") — the same name "Take" claims with — so a
// ticket this viewer took from the page can be moved, ticked and noted by them. A body that
// already says who (claim, take-over) keeps its own "as".
function withActor(body) {
  var b = body || {};
  var n = myName();
  if (n && b.as === undefined) {
    var copy = {};
    for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) copy[k] = b[k];
    copy.as = n;
    return copy;
  }
  return b;
}
function allowedUrl(id) {
  var n = myName();
  return "./api/allowed?id=" + encodeURIComponent(id) + (n ? "&as=" + encodeURIComponent(n) : "");
}

function api(path, body) {
  state.saving = true;
  return fetch("./api/" + path, {
    method: "POST",
    cache: "no-store",
    headers: { "Content-Type": "application/json", "X-Slate-Token": state.token },
    body: JSON.stringify(withActor(body))
  }).then(function (r) {
    return r.text().then(function (txt) {
      var j = null;
      try { j = JSON.parse(txt); } catch (e) { j = null; }
      if (!j || typeof j !== "object") {
        j = { ok: false, errors: [{ message: "The board server answered HTTP " + r.status
          + (txt ? ": " + txt.slice(0, 200) : ""), fix: [] }] };
      }
      if (!r.ok && j.ok === undefined) j.ok = false;
      if (j.ok === undefined) j.ok = r.ok;
      return j;
    });
  }).catch(function (err) {
    return { ok: false, errors: [{ message: "Could not reach the board server (" + (err && err.message ? err.message : err) + ").",
      fix: [BOARD_CMD + " serve --ensure"] }] };
  }).then(function (j) { state.saving = false; return j; });
}

function afterSave(msg, res) {
  noteActivity();
  return refreshNow().then(function () {
    showToast((res && typeof res.message === "string" && res.message) ? res.message : msg);
  });
}
function refused(title, res) {
  showRefusal(title, res);
  refreshNow();
}

function getJson(url) {
  return fetch(url, { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; });
}

// /api/allowed for every saved ticket (a few at a time), then grey out options in place.
var allowedRun = 0;
function loadAllowed() {
  if (!state.live) return;
  var run = ++allowedRun;
  var ids = savedTickets().map(function (t) { return t.id; });
  var fresh = {};
  var i = 0;
  var worker = function () {
    if (run !== allowedRun || i >= ids.length) return Promise.resolve();
    var id = ids[i++];
    return getJson(allowedUrl(id)).then(function (a) {
      if (a && Array.isArray(a.allowed)) fresh[id] = { allowed: a.allowed, reasons: (a.reasons && typeof a.reasons === "object") ? a.reasons : {} };
      return worker();
    });
  };
  var pool = [];
  for (var k = 0; k < 6; k++) pool.push(worker());
  return Promise.all(pool).then(function () {
    if (run !== allowedRun) return;
    state.allowed = fresh;
    applyAllowedToSelects();
  });
}

function decorateOptions(sel, t) {
  var a = allowedFor(t);
  Array.prototype.forEach.call(sel.options, function (o) {
    var why = a ? moveReason(t, o.value) : null;
    o.disabled = !!why;
    o.title = why || "";
    o.textContent = labelStatus(o.value) + (why ? " (not allowed)" : "");
  });
}
function applyAllowedToSelects() {
  Array.prototype.forEach.call(document.querySelectorAll("select.status[data-id]"), function (s) {
    var t = state.byId[s.dataset.id];
    if (t && document.activeElement !== s) decorateOptions(s, t);
  });
}

function myName() {
  try { return localStorage.getItem(NAME_KEY) || ""; } catch (e) { return ""; }
}
function ensureName() {
  var n = myName();
  if (n) return Promise.resolve(n);
  return askText({
    title: "Who is taking this?",
    message: "Your name (or branch) is shown on the card as “on: <name>”. It is remembered in this browser.",
    placeholder: "Your name", okLabel: "Save"
  }).then(function (v) {
    v = v === null ? null : v.trim();
    if (v) { try { localStorage.setItem(NAME_KEY, v); } catch (e) { /* private mode */ } }
    return v || null;
  });
}

function claimTicket(t) {
  var c = claimOf(t);
  ensureName().then(function (name) {
    if (!name) return;
    var body = { id: t.id, as: name };
    var send = function () {
      return api("claim", body).then(function (res) {
        if (res.ok) return afterSave("You are on " + t.id, res);
        refused("Can't take " + t.id, res);
      });
    };
    if (c && c.by !== name) {
      return askText({
        title: "Take over " + t.id + "?",
        message: c.by + " is on it (since " + (c.since || "?") + "). Only take over when they agree. Why?",
        placeholder: "Reason (saved in the history)", okLabel: "Take over"
      }).then(function (why) {
        if (why === null) return;
        body.take_over = why;
        return send();
      });
    }
    return send();
  });
}

function releaseTicket(t) {
  var c = claimOf(t), body = { id: t.id };
  if (c && c.by === myName()) body.as = c.by;
  api("release", body).then(function (res) {
    if (res.ok) return afterSave("Released " + t.id, res);
    refused("Can't release " + t.id, res);
  });
}

function claimOf(t) {
  var c = t && t.claimed_by;
  return (c && typeof c === "object" && typeof c.by === "string" && c.by) ? c : null;
}

/* ---------------- small builders ---------------- */

function prioBadge(p) { return el("span", "badge b-prio prio-" + (p || "P3"), p || "n/a"); }

function areaBadges(t) {
  return (t.areas || []).map(function (a) { return el("span", "badge b-area", a); });
}

function depChip(depId, onOpen) {
  var dep = state.byId[depId];
  var c = el("button", "chip " + (dep && isDone(dep) ? "done" : "open") + (isPreview(dep) ? " pv" : ""), depId);
  c.type = "button";
  c.title = dep ? dep.title + " (" + (isPreview(dep) ? "preview" : labelStatus(statusOf(dep))) + ")" : "unknown ticket";

  return c;
