function statusSelect(t, small) {
  var s = el("select", "status");
  s.setAttribute("aria-label", "Status of " + t.id);
  s.dataset.id = t.id;
  state.statuses.forEach(function (st) {
    var o = el("option", null, labelStatus(st));
    o.value = st;
    if (st === statusOf(t)) o.selected = true;
    s.appendChild(o);
  });
  decorateOptions(s, t);
  if (isPreview(t)) { s.disabled = true; s.title = "Preview tickets are not saved yet"; }
  else if (localStatus(t)) s.title = "Local only: the board still says " + labelStatus(t.status);
  s.addEventListener("click", function (e) { e.stopPropagation(); });
  s.addEventListener("change", function (e) { e.stopPropagation(); setStatus(t.id, s.value); });
  if (small) s.style.fontSize = "11px";
  return s;
}

// The one "state" badge a card or row shows, most important first.
function stateBadge(t) {
  if (isPreview(t)) return el("span", "badge b-preview", "preview");
  if (isDraft(t)) return el("span", "badge b-draft", "not ready");
  if (needsYou(t)) return el("span", "badge b-needs", "needs you");
  if (isMergeReady(t)) return el("span", "badge b-merge", "waiting for merge");
  if (isDone(t)) return null;
  if (isUnscheduled(t)) {
    var u = el("span", "badge b-unsched", "unscheduled");
    u.title = "In an unscheduled phase: not offered by next; move it to a scheduled phase to work on it";
    return u;
  }
  if (isBlocked(t)) return el("span", "badge b-blocked", "blocked");
  if (isReady(t)) return el("span", "badge b-ready", "ready");
  return null;
}

function prChip(pr) {
  var st = String(pr.state || "draft");
  var known = /^(draft|open|merged|closed)$/.test(st);
  var a = extLink(pr.url, "PR" + (typeof pr.number === "number" ? " #" + pr.number : "") + " · " + st,
    "chip prchip pr-" + (known ? st : "draft"));
  a.title = (pr.title ? pr.title + " · " : "") + pr.url;
  a.draggable = false;
  a.addEventListener("click", function (ev) { ev.stopPropagation(); });
  a.addEventListener("keydown", function (ev) { ev.stopPropagation(); });
  return a;
}

function fixesOf(t) {
  return (t.labels || []).filter(function (l) { return /^fixes-/.test(l); })
    .map(function (l) { return l.slice(6); });
}
function isBug(t) { return (t.labels || []).indexOf("bug") !== -1; }

function jumpChip(cls, text, targetId, title) {
  var c = el("button", "chip " + cls, text);
  c.type = "button";
  var target = state.byId[targetId];
  c.title = title || (target ? target.title + " (" + labelStatus(statusOf(target)) + ")" : "unknown ticket");
  c.addEventListener("click", function (ev) { ev.stopPropagation(); if (target) openDrawer(targetId); });
  return c;
}

// PR link, bug / fixes-<ID> labels and "blocked by <ID>" chips shown on cards.
function cardChips(t) {
  var box = el("div", "chips");
  var pr = prOf(t);
  if (pr) box.appendChild(prChip(pr));
  if (isBug(t)) {
    var b = el("span", "chip bug", "bug");
    b.title = "A bug found in other work";
    box.appendChild(b);
  }
  fixesOf(t).forEach(function (id) { box.appendChild(jumpChip("fix", "fixes " + id, id)); });
  var cl = claimOf(t);
  if (cl) {
    var ch = el("span", "chip claim", "on: " + cl.by);
    ch.title = cl.by + " is on it" + (cl.since ? " since " + cl.since : "");
    box.appendChild(ch);
  }
  if (isBlocked(t) && !isDone(t) && !isDraft(t) && !isPreview(t)) {
    var open = openDeps(t);
    open.slice(0, 3).forEach(function (id) { box.appendChild(jumpChip("open", "blocked by " + id, id)); });
    if (open.length > 3) {
      var more = el("span", "chip open", "+" + (open.length - 3) + " more");
      more.title = open.slice(3).join(", ");
      box.appendChild(more);
    }
  }
  return box.childNodes.length ? box : null;
}

/* ---------------- board view ---------------- */

function cardFor(t) {
  var blocked = isBlocked(t) && !isDone(t) && !isDraft(t) && !isPreview(t);
  var cls = "card";
  if (blocked) cls += " is-blocked";
  if (isDraft(t)) cls += " is-draft";
  if (needsYou(t)) cls += " needs-you";
  if (isPreview(t)) cls += " is-preview";
  var loc = localStatus(t);
  if (loc) cls += " is-local";
  var c = el("div", cls);
  c.dataset.id = t.id;
  c.tabIndex = 0;
  if (!isPreview(t)) {
    c.draggable = true;
    c.addEventListener("dragstart", function (e) {
      e.dataTransfer.setData("text/plain", t.id);
      e.dataTransfer.effectAllowed = "move";
      c.classList.add("dragging");
      markDropTargets(t);
    });
    c.addEventListener("dragend", function () { c.classList.remove("dragging"); markDropTargets(null); });
  }
  c.addEventListener("click", function () { openDrawer(t.id); });
  c.addEventListener("keydown", function (e) { if (e.key === "Enter") openDrawer(t.id); });

  var top = el("div", "top");
  top.appendChild(el("span", "cid", t.id));
  top.appendChild(el("span", "rank", "#" + t.rank));
  top.appendChild(el("span", "spacer"));
  top.appendChild(prioBadge(t.priority));
  c.appendChild(top);

  c.appendChild(el("div", "title", t.title));
  if (t.summary) {
    var sm = el("div", "summary", t.summary);
    sm.title = t.summary;
    c.appendChild(sm);
  }

  var meta = el("div", "meta");
  if (t.phase) meta.appendChild(el("span", "badge b-phase", t.phase));
  areaBadges(t).forEach(function (b) { meta.appendChild(b); });
  c.appendChild(meta);

  var chips = cardChips(t);
  if (chips) c.appendChild(chips);

  var foot = el("div", "foot");
  if (t.estimate) foot.appendChild(el("span", null, t.estimate));
  var dn = (t.depends_on || []).length;
  if (dn && !(isBlocked(t) && !isDone(t) && !isDraft(t) && !isPreview(t))) {
    foot.appendChild(el("span", null, dn + (dn > 1 ? " deps" : " dep")));
  }
  var b = stateBadge(t);
  if (b) foot.appendChild(b);
  if (loc) {
    var lt = el("span", "tag-local", "local only");
    lt.title = "Moved in this browser only; the board still says " + labelStatus(t.status)
      + ". Use “Copy as board.py commands” to save it.";
    foot.appendChild(lt);
  }
  if (foot.childNodes.length) c.appendChild(foot);
  return c;
}

// While a card is dragged: dim the columns it can't move to (reason in the tooltip).
function markDropTargets(t) {
  Array.prototype.forEach.call(document.querySelectorAll(".col[data-status]"), function (col) {
    var why = t ? moveReason(t, col.dataset.status) : null;
    col.classList.toggle("no-drop", !!why);
    if (why) col.title = why; else col.removeAttribute("title");
  });
}

function renderBoard(root) {
  var list = sortTickets(visible());
  var board = el("div", "board");
  state.statuses.forEach(function (st) {
    var col = el("div", "col col-" + st + (roleOf(st) ? " role-" + roleOf(st) : ""));
    col.dataset.status = st;

    var head = el("h2");
    head.appendChild(el("span", null, labelStatus(st)));
    var items = list.filter(function (t) { return statusOf(t) === st; });
    head.appendChild(el("span", "n", items.length));
    col.appendChild(head);

    var stack = el("div", "stack");
    if (!items.length) stack.appendChild(el("div", "empty", "Nothing here"));
    items.forEach(function (t) { stack.appendChild(cardFor(t)); });
    col.appendChild(stack);

    col.addEventListener("dragover", function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      col.classList.add("drop");
    });
    col.addEventListener("dragleave", function (e) {
      if (!col.contains(e.relatedTarget)) col.classList.remove("drop");
    });
    col.addEventListener("drop", function (e) {
      e.preventDefault();
      col.classList.remove("drop");
      var id = e.dataTransfer.getData("text/plain");
      markDropTargets(null);
      if (id && state.byId[id]) setStatus(id, st);
    });

    board.appendChild(col);
  });
  root.appendChild(board);
}

/* ---------------- implementation order view ---------------- */

function orderRow(t) {
  var muted = (isBlocked(t) && !isDone(t)) || isDraft(t);
  var r = el("div", "row" + (muted ? " muted" : "") + (isPreview(t) ? " is-preview" : "")
    + (localStatus(t) ? " is-local" : ""));
  r.appendChild(el("div", "rank", "#" + t.rank));
  r.appendChild(el("div", "rid", t.id));
  var tt = el("div", "rtitle", t.title);
  if (t.summary) tt.appendChild(el("span", "rsum", t.summary));
  r.appendChild(tt);

  var areas = el("div", "rareas");
  areaBadges(t).forEach(function (b) { areas.appendChild(b); });
  r.appendChild(areas);

  var pr = el("div", "rprio");
  pr.appendChild(prioBadge(t.priority));
  r.appendChild(pr);

  var deps = el("div", "deps");
  if ((t.depends_on || []).length) {
    t.depends_on.forEach(function (d) { deps.appendChild(depChip(d, openDrawer)); });
  } else {
    deps.appendChild(el("span", "rank", "no deps"));
  }
  var b = isDone(t) ? el("span", "badge b-ready", "done") : stateBadge(t);
  if (b) deps.appendChild(b);
  var prr = prOf(t);
  if (prr) deps.appendChild(prChip(prr));
  if (isBug(t)) deps.appendChild(el("span", "chip bug", "bug"));
  fixesOf(t).forEach(function (id) { deps.appendChild(jumpChip("fix", "fixes " + id, id)); });
  var rcl = claimOf(t);
  if (rcl) deps.appendChild(el("span", "chip claim", "on: " + rcl.by));
  if (localStatus(t)) deps.appendChild(el("span", "tag-local", "local only"));
  r.appendChild(deps);

  var sc = el("div");
  sc.appendChild(statusSelect(t, true));
  r.appendChild(sc);

  r.addEventListener("click", function () { openDrawer(t.id); });
  return r;
}

// opts: { open, empty, toggle } - collapsed phases show only their header.
function phaseBlock(p, all, rows, opts) {
  opts = opts || {};
  var unsched = p.unscheduled === true;
  var cls = "phase" + (p._preview ? " is-preview" : "") + (unsched ? " is-unsched" : "")
    + (opts.empty ? " is-empty" : "") + (opts.open ? " open" : " collapsed");
  var box = el("div", cls);
  box.dataset.phase = p.id;
  var head = el("header", opts.toggle ? "toggle" : null);

  var h = el("h2");
  if (opts.toggle) h.appendChild(el("span", "caret", "\u25B6"));
  h.appendChild(el("span", "badge b-phase", p.id));
  h.appendChild(el("span", null, p.name || p.id));
  if (p._preview) h.appendChild(el("span", "badge b-preview", "preview"));
  if (unsched) {
    var ub = el("span", "badge b-unsched", "unscheduled");
    ub.title = "Someday ideas: board.py next and /slate:work skip these tickets";
    h.appendChild(ub);
  }
  if (opts.empty) h.appendChild(el("span", "note", "no tickets yet"));
  else if (!opts.open) h.appendChild(el("span", "note", rows.length + (rows.length === 1 ? " ticket" : " tickets") + " hidden, click to show"));
  var doneN = all.filter(isDone).length;
  var pill = el("span", "pill", doneN + " / " + all.length + " done");
  pill.style.marginLeft = "auto";
  h.appendChild(pill);
  head.appendChild(h);

  if (opts.open) {
    if (p.goal) head.appendChild(el("p", "goal", "Goal: " + p.goal));
    if (p.demo) head.appendChild(el("p", "demo", "Demo: " + p.demo));
  } else if (p.goal || p.demo) {
    head.title = (p.goal ? "Goal: " + p.goal : "") + (p.goal && p.demo ? "\n" : "") + (p.demo ? "Demo: " + p.demo : "");
  }
  if (unsched && opts.open) {
    head.appendChild(el("p", "demo", "Not scheduled: move a ticket to a scheduled phase "
      + "(board.py edit ID phase=P2) before working on it."));
  }
  if (opts.open) {
    var bar = el("div", "bar");
    var fill = el("i");
    fill.style.width = (all.length ? Math.round(doneN / all.length * 100) : 0) + "%";
    bar.appendChild(fill);
    head.appendChild(bar);
  }
  if (opts.toggle) {
    head.tabIndex = 0;
    head.setAttribute("role", "button");
    head.setAttribute("aria-expanded", String(!!opts.open));
    var toggle = function () {
      state.phaseOpen[p.id] = !opts.open;
      renderKeepScroll();
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  }
  box.appendChild(head);

  if (opts.open) {
    var body = el("div", "rows");
    rows.forEach(function (t) { body.appendChild(orderRow(t)); });
    box.appendChild(body);
  }
  return box;
}

function renderOrder(root) {
  var vis = visible();
  var filtering = !!state.search || activeFilterCount() > 0;
  var groups = [], seen = {};
  state.phases.forEach(function (p) { groups.push(p); seen[p.id] = true; });
  (state.filterPhases || []).forEach(function (pid) {
    if (!seen[pid]) { groups.push({ id: pid, name: pid }); seen[pid] = true; }
  });
  // Phases keep their file order; unscheduled ones go last.
  groups = groups.filter(function (p) { return p.unscheduled !== true; })
    .concat(groups.filter(function (p) { return p.unscheduled === true; }));

  var any = false;
  groups.forEach(function (p) {
    var all = savedTickets().filter(function (t) { return t.phase === p.id; });
    var rows = vis.filter(function (t) { return t.phase === p.id; })
      .sort(function (a, b) { return a.rank - b.rank || cmp(a.id, b.id); });
    if (!rows.length) {
      // No tickets at all: a collapsed header so the phase is still visible. Hidden by filters: skip.
      if (filtering || all.length) return;
      root.appendChild(phaseBlock(p, all, rows, { empty: true, open: false, toggle: false }));
      return;
    }
    any = true;
    var open = Object.prototype.hasOwnProperty.call(state.phaseOpen, p.id)
      ? state.phaseOpen[p.id] : p.unscheduled !== true;
    root.appendChild(phaseBlock(p, all, rows, { open: open, toggle: true }));
  });
  if (!any) root.appendChild(el("div", "empty", filtering ? "No tickets match the current filters." : "No tickets yet."));
}

/* ---------------- ticket drawer ---------------- */

function openDrawer(id) {
  if (!state.byId[id]) return;
  var fresh = state.openId !== id;
  state.openId = id;
  renderDrawer(fresh);
}

function closeDrawer() {
  state.openId = null;
  $("#drawerHost").innerHTML = "";
}

function sect(title, hint) {
  var s = el("section", "dsect");
  var h = el("h3", null, title);
  if (hint) h.appendChild(el("span", "hint", hint));
  s.appendChild(h);
  return s;
}

function prose(md, cls) {
  var d = el("div", cls || "prose");
  d.innerHTML = mdToHtml(md);
  return d;
}

function checklist(t, kind, title, items) {
  var doneN = 0;
  (items || []).forEach(function (_, i) { if (isTicked(t, kind, i)) doneN++; });
  var s = sect(title, (items && items.length) ? doneN + " / " + items.length + " ticked" : null);
  if (!items || !items.length) { s.appendChild(el("div", "plain", "None listed yet.")); return s; }
  items.forEach(function (txt, i) {
    var rec = fileItemCheck(t, kind, i);
    var loc = !rec && checked(t.id, kind, i);
    var on = !!rec || loc;
    var lab = el("label", "check" + (on ? " on" : "") + (loc ? " local" : ""));
    var cb = el("input");
    cb.type = "checkbox";
    cb.checked = on;
    // View only: a tick saved in tickets.json is locked here (only board.py uncheck-item undoes it).
    // Live: ticks and unticks go to the board; a done ticket's items stay ticked.
    cb.disabled = isPreview(t) || (rec && (rec.done || !state.live));
    if (rec) lab.title = rec.done ? "The ticket is done" : (state.live ? "Ticked on the board; untick to undo it"
      : "Ticked on the board (board.py check-item)");
    cb.addEventListener("change", function () {
      if (state.live) {
        var path = cb.checked ? "check-item" : "uncheck-item";
        cb.disabled = true;
        api(path, { id: t.id, kind: kind, index: i }).then(function (res) {
          if (res.ok) return afterSave((cb.checked ? "Ticked " : "Unticked ") + t.id + " " + kind + " " + (i + 1), res);
          refused("Can't " + (cb.checked ? "tick" : "untick") + " this item", res);
        });
        return;
      }
      setChecked(t.id, kind, i, cb.checked);
      renderDrawer(false);
      updateChrome();
    });
    lab.appendChild(cb);
    var box = el("div", "ctext");
    var span = el("span");
    span.innerHTML = mdInline(esc(txt));
    box.appendChild(span);
    if (loc) {
      var lt = el("span", "tag-local", "local only");
      lt.title = "Ticked in this browser only; copy it as a board.py command to save it";
      box.appendChild(lt);
    }
    if (rec && !rec.done && (rec.date || rec.evidence)) {
      var ev = el("div", "ev", "Checked" + (rec.date ? " " + fmtDate(rec.date) : "")
        + (rec.evidence ? ": " + rec.evidence : ""));
      box.appendChild(ev);
    }
    lab.appendChild(box);
    s.appendChild(lab);
  });
  return s;
}

function fmtDate(d) { return d ? String(d) : ""; }

function userTestsSect(t) {
  var tests = t.user_tests || [];
  var passed = 0;
  var shownOf = function (i) {
    var rec = recordedUserTest(t, i), loc = localUserTest(t.id, i);
    if (loc === "reset") return null;
    return loc || (rec && rec.result) || null;
  };
  tests.forEach(function (_, i) { if (shownOf(i) === "pass") passed++; });
  var s = sect("Try it yourself", tests.length ? passed + " / " + tests.length + " passed" : null);
  if (!tests.length) {
    s.appendChild(el("div", "plain", "Nothing to try by hand for this ticket."));
    return s;
  }
  s.appendChild(el("p", "plain", state.live
    ? "Follow these steps in the app yourself, then click Pass or Fail. The result is saved on the board."
    : "Follow these steps in the app yourself. In this view-only page your Pass / Fail clicks stay in this "
      + "browser; copy them as board.py commands or tell Claude how it went so the result is saved."));

  tests.forEach(function (u, i) {
    u = u || {};
    var rec = recordedUserTest(t, i);
    var loc = localUserTest(t.id, i);
    var shown = shownOf(i);
    var card = el("div", "ut" + (shown === "pass" ? " passed" : (shown === "fail" ? " failed" : ""))
      + (loc ? " local" : ""));

    var head = el("div", "ut-head");
    head.appendChild(el("span", "ut-num", (i + 1) + "."));
    head.appendChild(el("span", "ut-title", u.title || ("Test " + (i + 1))));
    head.appendChild(el("span", "badge " + (u.required === false ? "b-area" : "b-phase"),
      u.required === false ? "optional" : "required"));
    if (loc) head.appendChild(el("span", "tag-local", "local only"));
    card.appendChild(head);

    if (u.setup) {
      card.appendChild(el("div", "subhead", "Before you start"));
      var su = el("div", "body");
      su.innerHTML = mdInline(esc(u.setup));
      card.appendChild(su);
    }
    var steps = arr(u.steps);
    if (steps.length) {
      card.appendChild(el("div", "subhead", "Steps"));
      var ol = el("ol", "body");
      steps.forEach(function (st) {
        var li = el("li");
        li.innerHTML = mdInline(esc(st));
        ol.appendChild(li);
      });
      card.appendChild(ol);
    }
    if (u.expect) {
      card.appendChild(el("div", "subhead", "You should see"));
      var ex = el("div", "body expect");
      ex.innerHTML = mdInline(esc(u.expect));
      card.appendChild(ex);
    }

    if (rec && rec.result) {
      var rr = el("div", "recorded");
      rr.appendChild(el("span", "badge " + (rec.result === "pass" ? "b-ready" : "b-fail"),
        "Recorded: " + (rec.result === "pass" ? "passed" : (rec.result === "fail" ? "failed" : rec.result))));
      if (rec.date) rr.appendChild(el("span", null, "on " + fmtDate(rec.date)));
      if (rec.note) rr.appendChild(el("span", null, "· " + rec.note));
      card.appendChild(rr);
    }

    var act = el("div", "actions");
    var noteIn = null;
    if (state.live) {
      noteIn = el("input", "utnote");
      noteIn.type = "text";
      noteIn.placeholder = "Note (optional): what you saw";
      noteIn.setAttribute("aria-label", "Note for test " + (i + 1));
      noteIn.disabled = isPreview(t);
    }
    var send = function (result) {
      var body = { id: t.id, index: i, result: result };
      var note = noteIn ? noteIn.value.trim() : "";
      if (note) body.note = note;
      api("usertest", body).then(function (res) {
        var what = result === "reset" ? "cleared" : (result === "pass" ? "passed" : "failed");
        if (res.ok) return afterSave(t.id + " test " + (i + 1) + ": " + what, res);
        refused("Can't record this result", res);
      });
    };
    [["pass", "Pass"], ["fail", "Fail"]].forEach(function (p) {
      var b = el("button", "btn " + p[0], p[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.live ? (rec && rec.result === p[0]) : loc === p[0]));
      b.disabled = isPreview(t);
      b.addEventListener("click", function () {
        if (state.live) { send(p[0]); return; }
        setUserTest(t.id, i, p[0]);
        renderDrawer(false);
        updateChrome();
      });
      act.appendChild(b);
    });
    // Clear result: board.py usertest ID N reset (live), or a local "reset" mark (view only).
    if ((rec && rec.result) || (loc && loc !== "reset")) {
      var clr = el("button", "btn subtle clear", "Clear result");
      clr.type = "button";
      clr.disabled = isPreview(t);
      clr.title = state.live ? "Remove the recorded result from the board" : "Clear the result (this browser only)";
      clr.addEventListener("click", function () {
        if (state.live) { send("reset"); return; }
        var e = entry(t.id);
        if (!e.checks) e.checks = {};
        if (rec && rec.result) e.checks[checkKey("usertest", i)] = "reset";
        else delete e.checks[checkKey("usertest", i)];
        tidyEntry(t.id);
        saveOverlay();
        renderDrawer(false);
        updateChrome();
      });
      act.appendChild(clr);
    }
    if (noteIn) act.appendChild(noteIn);
    else act.appendChild(el("span", "plain", loc
      ? (loc === "reset" ? "Cleared in this browser only." : "Your answer (this browser only): "
        + (loc === "pass" ? "passed" : "failed") + ". Click again to undo.")
      : (rec && rec.result ? "Try it again if you like." : "Not tried yet.")));
    card.appendChild(act);
    s.appendChild(card);
  });
  return s;
}

function linksSect(t) {
  var s = sect("Needs / Unlocks");
  var dl = el("dl", "links");
  function row(label, ids, none) {
    dl.appendChild(el("dt", null, label));
    var dd = el("dd");
    if (ids && ids.length) ids.forEach(function (id) { dd.appendChild(depChip(id, openDrawer)); });
    else dd.appendChild(el("span", "plain", none));
    dl.appendChild(dd);
  }
  row("Needs", t.depends_on, "No other tickets.");
  row("Unlocks", t.unlocks, "Nothing waits on this.");
  s.appendChild(dl);
  return s;
}

function historySect(t) {
  var h = t.handoff;
  if (typeof h === "string" && h) h = [{ note: h }];
  h = arr(h);
  if (!h.length) return null;
  var s = sect("History", h.length + (h.length === 1 ? " note" : " notes"));
  var ul = el("ul", "tl");
  h.forEach(function (x) {
    x = (x && typeof x === "object") ? x : { note: String(x) };
    var li = el("li");
    var w = el("div", "when");
    if (x.date) w.appendChild(el("span", null, fmtDate(x.date)));
    if (x.status) w.appendChild(el("span", "badge b-phase", labelStatus(x.status)));
    if (x.via) w.appendChild(el("span", "via", "via " + x.via));
    li.appendChild(w);
    var note = el("div", "note");
    note.innerHTML = mdInline(esc(x.note || ""));
    li.appendChild(note);
    ul.appendChild(li);
  });
  s.appendChild(ul);
  return s;
}

function technicalSect(t) {
  if (!t.technical) return null;
  var s = el("section", "dsect");
  var d = el("details", "tech");
  if (state.techOpen[t.id]) d.open = true;
  d.addEventListener("toggle", function () { state.techOpen[t.id] = d.open; });
  d.appendChild(el("summary", null, "Technical notes"));
  d.appendChild(prose(t.technical));
  s.appendChild(d);
  return s;
}

function isHttp(u) { return typeof u === "string" && /^https?:\/\/\S+$/i.test(u); }

function prOf(t) {
  return (t.pr && typeof t.pr === "object" && isHttp(t.pr.url)) ? t.pr : null;
}

// Link to a commit on the repo host: GitLab uses /-/commit/, GitHub and most others /commit/.
function commitUrl(sha) {
  if (!state.repoUrl || !/^[0-9a-f]{7,40}$/i.test(sha)) return null;
  var base = state.repoUrl.replace(/\/+$/, "").replace(/\.git$/, "");
  var host = "";
  try { host = new URL(base).hostname; } catch (e) { return null; }
  return base + (host.indexOf("gitlab") !== -1 ? "/-/commit/" : "/commit/") + sha;
}

function extLink(href, text, cls) {
  var a = el("a", cls || null, text);
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

function codeSect(t) {
  var pr = prOf(t);
  var commits = arr(t.commits).filter(function (c) { return c && typeof c.sha === "string"; });
  var dw = (t.done_without && typeof t.done_without === "object") ? t.done_without : {};
  if (!pr && !commits.length && !dw.code && !dw.pr) return null;
  var s = sect("Code changes", commits.length ? commits.length + (commits.length === 1 ? " commit" : " commits") : "");
  if (pr) {
    var row = el("div", "prline");
    row.appendChild(el("span", "lbl", "PR"));
    var label = (typeof pr.number === "number" ? "#" + pr.number + " " : "") + (pr.title || pr.url);
    var a = extLink(pr.url, label);
    a.title = pr.url;
    row.appendChild(a);
    var st = String(pr.state || "draft");
    row.appendChild(el("span", "badge pr-" + (/^(draft|open|merged|closed)$/.test(st) ? st : "draft"), st));
    s.appendChild(row);
  }
  if (commits.length) {
    var ul = el("ul", "commits");
    commits.forEach(function (c) {
      var li = el("li");
      var shortSha = c.sha.slice(0, 7);
      var href = commitUrl(c.sha);
      var shaEl = href ? extLink(href, shortSha, "sha mono") : el("code", "sha mono", shortSha);
      shaEl.title = c.sha + (c.branch ? " on " + c.branch : "");
      li.appendChild(shaEl);
      li.appendChild(el("span", "msg", c.message || "(no message)"));
      if (c.date) li.appendChild(el("span", "cdate", fmtDate(c.date)));
      ul.appendChild(li);
    });
    s.appendChild(ul);
  }
  if (typeof dw.code === "string" && dw.code) s.appendChild(el("div", "nocode", "Closed without code: " + dw.code));
  if (typeof dw.pr === "string" && dw.pr) s.appendChild(el("div", "nocode", "Closed without a PR: " + dw.pr));
  return s;
}

function planSect(t) {
  if (!t.plan_doc) return null;
  var s = sect("Plan doc");
  s.appendChild(el("code", "path", t.plan_doc));
  return s;
}

function missingForDraft(t) {
  var m = [];
  if (!t.story) m.push("story");
  if (!t.description) m.push("details");
  if (!t.acceptance.length) m.push("done-when checks");
  if (!t.test_scenarios.length) m.push("automated tests");
  var needsUT = (t.areas || []).some(function (a) { return state.userTestAreas.indexOf(a) !== -1; });
  if (needsUT && !t.user_tests.some(function (u) { return u && u.required !== false; })) m.push("a try-it-yourself test");
  if (!t.estimate) m.push("estimate");
  return m;
}

// "On it: <by> since <since>" plus Take / Release (live mode).
function claimLine(t) {
  if (isPreview(t)) return null;
  var c = claimOf(t);
  if (!c && !state.live) return null;
  var line = el("div", "claimline");
  if (c) {
    var sp = el("span");
    sp.appendChild(document.createTextNode("On it: "));
    sp.appendChild(el("b", null, c.by));
    if (c.since) sp.appendChild(document.createTextNode(" since " + c.since));
    line.appendChild(sp);
  } else line.appendChild(el("span", null, "Nobody is on this ticket."));
  if (state.live && !isDone(t)) {
    var me = myName();
    if (!c || c.by !== me) {
      var take = el("button", "btn", c ? "Take over…" : "Take");
      take.id = "takeBtn";
      take.type = "button";
      take.title = "Show that you are working on it" + (me ? " (as " + me + ")" : "");
      take.addEventListener("click", function () { claimTicket(t); });
      line.appendChild(take);
    }
    if (c) {
      var rel = el("button", "btn subtle", "Release");
      rel.id = "releaseBtn";
      rel.type = "button";
      rel.addEventListener("click", function () { releaseTicket(t); });
      line.appendChild(rel);
    }
  }
  return line;
}

// "Add note": a history note without a status change (board.py note).
function noteSect(t) {
  if (isPreview(t)) return null;
  var s = sect("Add note", state.live ? "saved in the history" : null);
  if (!state.live) {
    var p = el("div", "plain");
    p.appendChild(document.createTextNode("View only. Add a note with "));
    p.appendChild(el("code", "md-code", BOARD_CMD + " note " + t.id + " \"text\""));
    p.appendChild(document.createTextNode(" or open the board with "));
    p.appendChild(el("code", "md-code", BOARD_CMD + " serve"));
    p.appendChild(document.createTextNode("."));
    s.appendChild(p);
    return s;
  }
  var box = el("div", "notebox");
  var ta = el("textarea");
  ta.id = "noteText";
  ta.placeholder = "e.g. Waiting on the design review";
  ta.setAttribute("aria-label", "Note for " + t.id);
  var row = el("div", "row2");
  var b = el("button", "btn primary", "Add note");
  b.id = "noteBtn";
  b.type = "button";
  b.addEventListener("click", function () {
    var text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    b.disabled = true;
    api("note", { id: t.id, text: text }).then(function (res) {
      if (res.ok) { ta.value = ""; return afterSave("Note added to " + t.id, res); }
      b.disabled = false;
      showRefusal("Can't add the note", res);
    });
  });
  row.appendChild(b);
  box.appendChild(ta);
  box.appendChild(row);
  s.appendChild(box);
  return s;
}

function renderDrawer(fresh) {
  var host = $("#drawerHost");
  var oldBody = $(".dbody", host);
  var keepScroll = (!fresh && oldBody) ? oldBody.scrollTop : 0;
  host.innerHTML = "";
  var t = state.byId[state.openId];
  if (!t) return;

  var scrim = el("div", "scrim");
  scrim.addEventListener("click", closeDrawer);
  host.appendChild(scrim);

  var d = el("aside", "drawer");
  d.setAttribute("role", "dialog");
  d.setAttribute("aria-modal", "true");
  d.setAttribute("aria-label", t.id + " " + t.title);

  var head = el("header");
  var top = el("div", "dtop");
  top.appendChild(el("span", "cid mono", t.id));
  top.appendChild(el("span", "rank", "#" + t.rank));
  var sb = stateBadge(t);
  if (sb) top.appendChild(sb);
  top.appendChild(el("span", "spacer"));

  var order = byRank();
  var pos = -1;
  order.forEach(function (x, i) { if (x.id === t.id) pos = i; });

  var prev = el("button", "btn subtle", "← Prev");
  prev.id = "drawerPrev";
  prev.disabled = pos <= 0;
  prev.addEventListener("click", function () { openDrawer(order[pos - 1].id); });
  var next = el("button", "btn subtle", "Next →");
  next.id = "drawerNext";
  next.disabled = pos < 0 || pos >= order.length - 1;
  next.addEventListener("click", function () { openDrawer(order[pos + 1].id); });
  var close = el("button", "btn", "Close");
  close.addEventListener("click", closeDrawer);
  top.appendChild(prev);
  top.appendChild(next);
  top.appendChild(close);
  head.appendChild(top);
  head.appendChild(el("h2", null, t.title));

  var meta = el("div", "dmeta");
  function sep() { meta.appendChild(el("span", "sep", "·")); }
  meta.appendChild(statusSelect(t));
  var phase = phaseById(t.phase);
  sep();
  meta.appendChild(el("span", "badge b-phase", "Phase " + (t.phase || "n/a")));
  if (phase && phase.name) meta.appendChild(el("span", null, phase.name));
  if (isUnscheduled(t)) meta.appendChild(el("span", "badge b-unsched", "unscheduled"));
  sep();
  meta.appendChild(prioBadge(t.priority));
  if (t.estimate) { sep(); meta.appendChild(el("span", null, t.estimate)); }
  if ((t.areas || []).length) { sep(); areaBadges(t).forEach(function (b) { meta.appendChild(b); }); }
  if ((t.labels || []).length) {
    sep();
    t.labels.forEach(function (l) {
      if (l === "bug") meta.appendChild(el("span", "badge b-bug", "bug"));
      else if (/^fixes-/.test(l)) meta.appendChild(jumpChip("fix", "fixes " + l.slice(6), l.slice(6)));
      else meta.appendChild(el("span", "badge b-area", "#" + l));
    });
  }
  if (!isDone(t) && !isDraft(t) && !isPreview(t) && (isBlocked(t) || isReady(t))) {
    sep();
    var nOpen = openDeps(t).length;
    meta.appendChild(el("span", "badge " + (nOpen ? "b-blocked" : "b-ready"),
      nOpen ? "waiting on " + nOpen + (nOpen === 1 ? " ticket" : " tickets") : "ready to start"));
  }
  head.appendChild(meta);
  var cline = claimLine(t);
  if (cline) head.appendChild(cline);
  d.appendChild(head);

  var body = el("div", "dbody");

  if (isPreview(t)) {
    var pv = el("div", "notice pv");
    pv.innerHTML = "<b>Preview.</b> This ticket is not saved yet. It is on the board so you can look it over; "
      + "nothing is written until Claude runs <code>board.py add</code>. It is left out of Export.";
    body.appendChild(pv);
  } else if (isMergeReady(t)) {
    var mr = el("div", "notice pv");
    var prm = prOf(t);
    mr.appendChild(el("b", null, "Waiting for merge. "));
    mr.appendChild(document.createTextNode("Built, reviewed and tested. It moves to Done once you "
      + "tell Claude the pull request is merged" + (prm ? ": " : ".")));
    if (prm) mr.appendChild(extLink(prm.url, (typeof prm.number === "number" ? "#" + prm.number + " " : "")
      + (prm.title || prm.url)));
    body.appendChild(mr);
  } else if (isUnscheduled(t) && !isDone(t)) {
    var us = el("div", "notice dr");
    us.innerHTML = "<b>Unscheduled.</b> This ticket sits in a someday phase, so <code>board.py next</code> "
      + "and <code>/slate:work</code> skip it. Move it to a scheduled phase first "
      + "(<code>board.py edit " + esc(t.id) + " phase=&lt;phase&gt;</code>).";
    body.appendChild(us);
  } else if (isDraft(t)) {
    var miss = missingForDraft(t);
    var dr = el("div", "notice dr");
    dr.innerHTML = "<b>Draft: not ready to work on.</b> "
      + (miss.length ? "Still missing: " + esc(miss.join(", ")) + "." : "It looks complete; promote it when you agree.");
    var pb = el("div", "row2");
    pb.style.marginTop = "8px";
    if (state.live) {
      var prom = el("button", "btn primary", "Promote");
      prom.id = "promoteBtn";
      prom.type = "button";
      prom.title = "Turn this draft into a backlog ticket (board.py promote " + t.id + ")";
      prom.addEventListener("click", function () {
        prom.disabled = true;
        api("promote", { id: t.id }).then(function (res) {
          if (res.ok) return afterSave("Promoted " + t.id, res);
          refused("Can't promote " + t.id, res);
        });
      });
      pb.appendChild(prom);
    } else {
      pb.appendChild(el("span", "plain", "To promote it: "));
      pb.appendChild(el("code", "md-code", BOARD_CMD + " promote " + t.id));
    }
    dr.appendChild(pb);
    body.appendChild(dr);
  }

  function add(node) { if (node) body.appendChild(node); }

  if (isLegacy(t)) {
    // Older tickets without summary/story: description first, as the original board did.
    if (t.description) { var s0 = sect("Details"); s0.appendChild(prose(t.description)); add(s0); }
    add(checklist(t, "acceptance", "Done when", t.acceptance));
    add(checklist(t, "test", "Automated tests", t.test_scenarios));
    if (t.user_tests.length) add(userTestsSect(t));
    add(technicalSect(t));
    add(linksSect(t));
    add(planSect(t));
    add(codeSect(t));
    add(historySect(t));
  } else {
    if (t.summary) { var s1 = sect("Summary"); s1.appendChild(prose(t.summary, "lead")); add(s1); }
    if (t.story) { var s2 = sect("Story"); s2.appendChild(prose(t.story, "story")); add(s2); }
    if (t.visual) {
      var s3 = sect("Picture", "scroll sideways if it is wide");
      s3.appendChild(prose(t.visual));
      add(s3);
    }
    if (!isDraft(t) || t.acceptance.length) add(checklist(t, "acceptance", "Done when", t.acceptance));
    if (t.user_tests.length || !isDraft(t)) add(userTestsSect(t));
    if (!isDraft(t) || t.test_scenarios.length) add(checklist(t, "test", "Automated tests", t.test_scenarios));
    if (t.description) { var s4 = sect("Details"); s4.appendChild(prose(t.description)); add(s4); }
    add(technicalSect(t));
    add(linksSect(t));
    add(planSect(t));
    add(codeSect(t));
    add(historySect(t));
  }
  add(noteSect(t));

  d.appendChild(body);
  host.appendChild(d);
  if (fresh) close.focus(); else body.scrollTop = keepScroll;
}

/* ---------------- header chrome ---------------- */

function buildMenu(detailsId, key, values, labelFn) {
  var d = $("#" + detailsId);
  var menu = $(".menu", d);
  menu.innerHTML = "";
  values.forEach(function (v) {
    var lab = el("label");
    var cb = el("input");
    cb.type = "checkbox";
    cb.checked = state.filters[key].indexOf(v) !== -1;
    cb.addEventListener("change", function () {
      var a = state.filters[key];
      var i = a.indexOf(v);
      if (cb.checked && i === -1) a.push(v);
      if (!cb.checked && i !== -1) a.splice(i, 1);
      render();
    });
    lab.appendChild(cb);
    lab.appendChild(el("span", null, labelFn ? labelFn(v) : v));
    var n = state.tickets.filter(function (t) {
      if (key === "area") return (t.areas || []).indexOf(v) !== -1;
      if (key === "status") return statusOf(t) === v;
      if (key === "priority") return t.priority === v;
      return t.phase === v;
    }).length;
    lab.appendChild(el("span", "dim", n));
    menu.appendChild(lab);
  });
  var badge = $(".count", d);
  var sel = state.filters[key].length;
  badge.textContent = sel;
  badge.hidden = sel === 0;
}

function updateChrome() {
  var saved = savedTickets();
  var total = saved.length;
  var done = saved.filter(isDone).length;
  var prog = saved.filter(isInProgress).length;
  var waiting = saved.filter(needsYou).length;

  var counts = $("#counts");
  counts.innerHTML = "";
  [["total", total], ["done", done], ["in progress", prog]].forEach(function (p) {
    var s = el("span", "pill");
    s.innerHTML = "<b>" + p[1] + "</b> " + esc(p[0]);
    counts.appendChild(s);
  });
  if (waiting) {
    var w = el("button", "pill needs");
    w.type = "button";
    w.title = "Show only tickets waiting for you to try them";
    w.innerHTML = "<b>" + waiting + "</b> waiting for you to test";
    w.addEventListener("click", function () {
      state.filters.status = statusesWithRole("user_testing");
      render();
    });
    counts.appendChild(w);
  }
  var merging = saved.filter(isMergeReady).length;
  if (merging) {
    var m = el("button", "pill");
    m.type = "button";
    m.title = "Show only tickets waiting for their pull request to be merged";
    m.innerHTML = "<b>" + merging + "</b> waiting for merge";
    m.addEventListener("click", function () { state.filters.status = statusesWithRole("merge_ready"); render(); });
    counts.appendChild(m);
  }
  var unsIds = state.phases.filter(function (p) { return p.unscheduled === true; }).map(function (p) { return p.id; });
  var unsN = saved.filter(isUnscheduled).length;
  if (unsN) {
    var u = el("button", "pill");
    u.type = "button";
    u.title = "Show only tickets in unscheduled (someday) phases";
    u.innerHTML = "<b>" + unsN + "</b> unscheduled";
    u.addEventListener("click", function () { state.filters.phase = unsIds.slice(); render(); });
    counts.appendChild(u);
  }

  var meta = (state.raw && state.raw.meta) || {};
  $("#gen").textContent = meta.generated ? "generated " + meta.generated : "";

  // Live (board.py serve) vs view only.
  var mode = $("#modePill");
  if (state.live) {
    mode.className = "pill mode live";
    mode.textContent = "Live: changes save to the board";
    mode.title = "Served by board.py serve" + (state.live.board_path ? " \u00b7 " + state.live.board_path : "");
  } else {
    mode.className = "pill mode view";
    mode.innerHTML = "View only: open with <code>" + esc(BOARD_CMD) + " serve</code> to save clicks";
    mode.title = "Clicks here stay in this browser until you run the board.py commands";
  }

  var n = changeCount();
  var dirty = $("#dirty");
  dirty.hidden = !!state.live;
  dirty.className = "pill" + (n ? " local-n" : "");
  dirty.innerHTML = n ? "<b>" + n + "</b> local change" + (n === 1 ? "" : "s") + " not on the board"
    : "<b>0</b> local changes";
  $("#copyCmdsBtn").hidden = !!state.live || n === 0;
  $("#resetBtn").hidden = !!state.live;

  var removed = removedEntries();
  $("#removedBtn").hidden = !removed.length;
  $("#removedBtn").textContent = "Removed (" + removed.length + ")";
  var ulog = unlockLog();
  $("#historyBtn").hidden = !ulog.length;
  $("#historyBtn").textContent = "Board history (" + ulog.length + ")";

  var af = activeFilterCount();
  $("#fcount").textContent = af;
  $("#clearFilters").hidden = af === 0;
  $("#sortWrap").style.display = state.view === "board" ? "" : "none";
  $("#viewBoard").setAttribute("aria-pressed", String(state.view === "board"));
  $("#viewOrder").setAttribute("aria-pressed", String(state.view === "order"));

  var foot = "Slate v" + SLATE_VERSION;
  if (meta.slate_version || meta.schema_version) {
    foot += " · tickets.json " + (meta.slate_version || "?") + " / schema " + (meta.schema_version || "?");
    if (meta.slate_version && meta.slate_version !== SLATE_VERSION) foot += " (different Slate version, run /slate:upgrade)";
  }
  $("#siteFoot").textContent = foot;
}

function removedEntries() {
  var r = state.raw && state.raw.meta && state.raw.meta.removed;
  return arr(r).filter(function (x) { return x && typeof x === "object"; });
}
function unlockLog() {
  var r = state.raw && state.raw.meta && state.raw.meta.unlock_log;
  return arr(r).filter(function (x) { return x && typeof x === "object"; });
}
// The active unlock: /api/info unlock_active (live) or kanban/.slate-unlock.json (view only).
function activeUnlock() {
  var u = state.live ? state.live.unlock_active : state.unlockFile;
  if (!u || typeof u !== "object") return null;
  if (u.until) {
    var t = Date.parse(u.until);
    if (!isNaN(t) && t <= Date.now()) return null;
  }
  return u;
}
function fmtUntil(iso) {
  var t = Date.parse(iso);
  if (isNaN(t)) return String(iso || "?");
  var d = new Date(t);
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  return pad(d.getHours()) + ":" + pad(d.getMinutes());
}

// A one-line status banner: title + short action; click to expand the details (kept open across
// re-renders by id).
var bannerOpen = {};
function banner(id, cls, title, action, details) {
  var b = el("details", "banner" + (cls ? " " + cls : ""));
  b.id = id;
  b.setAttribute("role", "status");
  if (bannerOpen[id]) b.open = true;
  b.addEventListener("toggle", function () { bannerOpen[id] = b.open; });
  var sum = el("summary");
  sum.appendChild(el("strong", null, title));
  if (action) sum.appendChild(el("span", "bact", action));
  if (details && (typeof details === "string" || details.length)) sum.appendChild(el("span", "bmore", "details"));
  b.appendChild(sum);
  if (details && (typeof details === "string" || details.length)) {
    var body = el("div", "bbody");
    if (typeof details === "string") body.appendChild(el("div", null, details));
    else {
      var ul = el("ul");
      details.forEach(function (d) {
        var li = el("li", null, String(d.text));
        if (d.title) li.title = d.title;
        ul.appendChild(li);
      });
      body.appendChild(ul);
    }
    b.appendChild(body);
  }
  $("#bannerHost").appendChild(b);
  return b;
}

function renderBanner() {
  var host = $("#bannerHost");
  host.innerHTML = "";
  var meta = (state.raw && state.raw.meta) || {};

  var un = activeUnlock();
  if (un) {
    banner("unlockBanner", "bad", "One direct edit allowed until " + fmtUntil(un.until) + " (then locks again).",
      un.reason ? "Reason: " + un.reason : "",
      "The next direct edit of tickets.json is allowed once; after it, or at " + fmtUntil(un.until)
        + ", the board locks again. Every board.py command still checks the file.");
  }

  var issues = state.live && state.live.doctor && arr(state.live.doctor.issues);
  if (issues && issues.length) {
    var setup = issues.filter(function (x) { return x && x.kind !== "tickets"; });
    var tick = issues.filter(function (x) { return x && x.kind === "tickets"; });
    var items = function (list) {
      return list.map(function (x) { return { text: x.message || x.code || "problem", title: x.code || "" }; });
    };
    if (tick.length) banner("doctorTickets", "bad", "Board needs sorting", "run /slate:sync", items(tick));
    if (setup.length) banner("doctorSetup", "warn", "Setup needs attention", "run /slate:upgrade", items(setup));
  }

  // Version: page vs board file vs server.
  var other = (state.live && state.live.version && state.live.version !== SLATE_VERSION) ? state.live.version
    : (meta.slate_version && meta.slate_version !== SLATE_VERSION ? meta.slate_version : null);
  if (other && !(issues && issues.length)) {
    banner("versionBanner", "warn", "Different Slate version", "run /slate:upgrade",
      "This page is Slate " + SLATE_VERSION + ", the board " + (state.live && state.live.version ? "server" : "file")
      + " is " + other + ".");
  }

  if (state.lostLive) {
    banner("lostBanner", "warn", "Board server stopped", "run " + BOARD_CMD + " serve --ensure, then reload",
      "Clicks now stay in this browser until the server is back.");
  }

  if (state.previewCount) {
    banner("previewBanner", "", "Preview: " + state.previewCount + " ticket" + (state.previewCount === 1 ? "" : "s")
      + " not yet saved", "dashed borders",
      "Nothing is saved until Claude runs board.py add; board.py discard-preview removes them. Export leaves them out.");
  }
}

var modalCancel = null;
function closeModal() { modalCancel = null; $("#modalHost").innerHTML = ""; }
function cancelModal() { var c = modalCancel; closeModal(); if (c) c(); }

// A dialog with a title, body nodes and buttons [[label, cls, fn]]. Escape / scrim click closes.
function openModal(title, nodes, buttons, onCancel) {
  var host = $("#modalHost");
  host.innerHTML = "";
  var scrim = el("div", "modal-scrim");
  var m = el("div", "modal");
  m.setAttribute("role", "dialog");
  m.setAttribute("aria-modal", "true");
  m.setAttribute("aria-label", title);
  m.appendChild(el("h3", null, title));
  nodes.forEach(function (n) { if (n) m.appendChild(n); });
  var bs = el("div", "mbtns");
  (buttons || [["Close", "btn", null]]).forEach(function (b) {

    bs.appendChild(btn);
  });
  m.appendChild(bs);
  scrim.appendChild(m);
  scrim.addEventListener("mousedown", function (e) { if (e.target === scrim) cancelModal(); });
  host.appendChild(scrim);
  modalCancel = onCancel || null;

}

// Ask for text. Resolves to the text (trimmed) or null when cancelled.
function askText(o) {
  return new Promise(function (resolve) {
    var settled = false;
    var finish = function (v) { if (settled) return; settled = true; closeModal(); resolve(v); };
    var input = el(o.multiline ? "textarea" : "input");
    if (!o.multiline) input.type = "text";
    input.id = "askInput";
    input.placeholder = o.placeholder || "";
    input.setAttribute("aria-label", o.placeholder || o.title);
    if (o.value) input.value = o.value;
    var ok = function () {
      var v = input.value.trim();
      if (!v && !o.optional) { input.focus(); return; }
      finish(v);
    };
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (!o.multiline || e.metaKey || e.ctrlKey)) { e.preventDefault(); ok(); }
    });
    var m = openModal(o.title, [o.message ? el("p", null, o.message) : null, input],
      [["Cancel", "btn subtle", function () { finish(null); }], [o.okLabel || "OK", "btn primary", ok]],
      function () { if (!settled) { settled = true; resolve(null); } });
    m.id = "askModal";
    var okBtn = m.querySelector(".mbtns .btn.primary");
    okBtn.id = "askOk";
    var sync = function () { okBtn.disabled = !o.optional && !input.value.trim(); };
    input.addEventListener("input", sync);
    sync();
    setTimeout(function () { input.focus(); }, 0);
  });
}

/* ---------------- view only: local changes as board.py commands ---------------- */

function shq(s) {
  s = String(s);
  return /^[A-Za-z0-9_.\/:@%+=,-]+$/.test(s) ? s : "'" + s.replace(/'/g, "'\"'\"'") + "'";
}

// One command per FINAL local state (the overlay only keeps the last status / tick of each item).
// check-item and usertest lines first (gates read them), then status moves; both in rank order so
// dependencies land before dependents. Moves to the same status with no handoff note needed become
// one bulk `set ID1,ID2 STATUS` (all or nothing in board.py), placed where its first ticket ranks.
function localCommands() {
  var items = [], moves = [];
  savedTickets().slice().sort(function (a, b) { return a.rank - b.rank || cmp(a.id, b.id); }).forEach(function (t) {
    var o = state.overlay[t.id];
    if (!o) return;
    if (o.checks) Object.keys(o.checks).sort(function (x, y) {
      var kx = x.split(":"), ky = y.split(":");
      return cmp(kx[0], ky[0]) || Number(kx[1]) - Number(ky[1]);
    }).forEach(function (k) {
      var v = o.checks[k];
      if (markInFile(t, k, v)) return;
      var m = /^(acceptance|test):(\d+)$/.exec(k);
      if (m) items.push(BOARD_CMD + " check-item " + shq(t.id) + " " + m[1] + " " + m[2]);
      var u = /^usertest:(\d+)$/.exec(k);
      if (u) items.push(BOARD_CMD + " usertest " + shq(t.id) + " " + u[1] + " " + v);
    });
    if (o.status && o.status !== t.status) {
      moves.push({ id: t.id, status: o.status,
        needs: noteRequired(o.status) || (isBackward(t.status, o.status) && hasPathRules()) });
    }
  });
  var sets = [], groups = {};
  moves.forEach(function (mv) {
    if (mv.needs) {
      sets.push(BOARD_CMD + " set " + shq(mv.id) + " " + shq(mv.status) + " --handoff \"" + HANDOFF_PLACEHOLDER + "\"");
      return;
    }
    var g = groups[mv.status];
    if (!g) { g = groups[mv.status] = { ids: [], at: sets.length }; sets.push(null); }
    g.ids.push(mv.id);
  });
  Object.keys(groups).forEach(function (st) {
    sets[groups[st].at] = BOARD_CMD + " set " + groups[st].ids.map(shq).join(",") + " " + shq(st);
  });
  return items.concat(sets);
}

function copyText(text) {
  var fallback = function () {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return Promise.resolve(ok);
  };
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
  }
  return fallback();
}

        + "(or paste them to Claude). " + (placeholder ? "Replace " + HANDOFF_PLACEHOLDER + " with a real note. " : "")
        + "Local marks disappear once the board has them."

// Re-render without losing the page, board-column and drawer scroll positions.
function renderKeepScroll() {
  var sx = window.scrollX, sy = window.scrollY;
  var board = $(".board");
  var left = board ? board.scrollLeft : 0;
  var stacks = {};
  Array.prototype.forEach.call(document.querySelectorAll(".col"), function (c) {
    var st = $(".stack", c);
    if (st) stacks[c.dataset.status] = st.scrollTop;
  });
  render();

/* ---------------- live refresh (served folder only) ---------------- */

var toastTimer = null;
function showToast(text) {
  var t = $("#toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 2500);
}

function fetchText(url) {
  return fetch(url, { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : null; })
    .catch(function () { return null; });
}

// Conditional GET: If-Modified-Since with the Last-Modified of the response last shown.
// -> { kind: "same" } (304), { kind: "ok", text, lm }, { kind: "missing" } (404) or { kind: "error" }.
function fetchCond(url, full) {
  var headers = {};
  if (!full && state.lastMod[url]) headers["If-Modified-Since"] = state.lastMod[url];
  return fetch(url, { cache: "no-store", headers: headers })
    .then(function (r) {
      if (r.status === 304) return { kind: "same" };
      if (r.status === 404) return { kind: "missing" };
      if (!r.ok) return { kind: "error" };
      var lm = r.headers.get("Last-Modified");
      return r.text().then(function (text) { return { kind: "ok", text: text, lm: lm }; });
    })
    .catch(function () { return { kind: "error" }; });
}

// Something the viewer is in the middle of that a re-render would break.
function busy() {
  if (document.querySelector(".card.dragging")) return true;
  if (modalOpen() || state.saving) return true;
  var a = document.activeElement;
  if (!a || !a.closest || !a.closest("#main, #drawerHost")) return false;
  if (a.tagName === "SELECT") return true;
  return (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type === "text")) && !!a.value;
}

function applyUpdate(data, preview, quiet) {
  var meta = (data && data.meta) || {};
  var key = "slate." + String(meta.prefix || "board") + ".overlay.v1";
  if (key !== OVERLAY_KEY) { OVERLAY_KEY = key; state.overlay = loadOverlay(); }
  normalise(data || {}, isPreviewDoc(preview) ? preview : null);
  pruneOverlay();
  state.allowed = {};
  setTitle(meta);
  if (state.openId && !state.byId[state.openId]) closeDrawer();
  renderKeepScroll();
  if (!quiet) showToast("Board updated");
  loadAllowed();
}

var TICKETS_URL = "./tickets.json", PREVIEW_URL = "./preview.json";

// Re-read tickets.json and preview.json and re-render when either changed. full: skip
// If-Modified-Since and compare the content (the safety net; Last-Modified has 1 s steps).
// force: apply even while the viewer is busy (right after a save). A half-written or invalid
// file is skipped until the next round.
function poll(full, force) {
  if (state.source !== "fetch") return Promise.resolve(false);
  if (state.polling && !force) return Promise.resolve(false);
  state.polling = true;
  return Promise.all([fetchCond(TICKETS_URL, full), fetchCond(PREVIEW_URL, full)])
    .then(function (res) {
      var t = res[0], p = res[1];
      if (t.kind === "error" || t.kind === "missing") return false;
      if (full) state.lastFull = Date.now();
      var tt = t.kind === "same" ? state.lastText.t : t.text;
      var pt = p.kind === "same" ? state.lastText.p : (p.kind === "ok" ? p.text : null);
      if (p.kind === "error") pt = state.lastText.p;
      var commit = function () {
        state.lastText = { t: tt, p: pt };
        if (t.kind === "ok" && t.lm) state.lastMod[TICKETS_URL] = t.lm;
        if (p.kind === "ok" && p.lm) state.lastMod[PREVIEW_URL] = p.lm;
        if (p.kind === "missing") delete state.lastMod[PREVIEW_URL];
      };
      var sig = tt + "\u0000" + (pt || "");
      if (sig === state.lastSig) { commit(); return false; }
      var data, pv = null;
      try { data = JSON.parse(tt); } catch (e) { return false; }
      if (pt) { try { pv = JSON.parse(pt); } catch (e) { pv = null; } }
      if (!data || typeof data !== "object") return false;
      if (!force && busy()) return false;     // try again next round (not committed, so no 304)
      commit();
      state.lastSig = sig;
      state.lastActivity = Date.now();
      applyUpdate(data, pv, !!force);
      return true;
    })
    .catch(function () { return false; })
    .then(function (changed) { state.polling = false; return changed; });
}

// Right after a save: re-read the file and the server info now.
function refreshNow() {
  return Promise.all([poll(true, true), refreshInfo()]).then(function () { applyAllowedToSelects(); });
}

// /api/info: live mode, token, doctor, active unlock. Two misses in a row -> view only.
function readInfo() {
  return fetch("./api/info", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { return (j && typeof j === "object" && j.slate === true) ? j : null; })
    .catch(function () { return null; });
}
function setLive(info) {
  state.live = info;
  var tokenMeta = document.querySelector('meta[name="slate-token"]');
  state.token = (info && typeof info.token === "string" && info.token)
    || (tokenMeta && tokenMeta.getAttribute("content")) || "";
}
function refreshInfo() {
  if (state.source !== "fetch") return Promise.resolve();
  if (!state.live) {
    // View only: show an active unlock straight from kanban/.slate-unlock.json when it is served.
    return getJson("./.slate-unlock.json").then(function (u) {
      var before = JSON.stringify(state.unlockFile);
      state.unlockFile = (u && typeof u === "object" && u.until) ? u : null;
      if (JSON.stringify(state.unlockFile) !== before) renderBanner();
    });
  }
  return readInfo().then(function (info) {
    if (info) {
      state.infoFails = 0;
      var before = JSON.stringify([state.live.doctor, state.live.unlock_active, state.live.version]);
      setLive(info);
      if (JSON.stringify([info.doctor, info.unlock_active, info.version]) !== before) renderBanner();
      return;
    }
    if (++state.infoFails >= 2) {
      setLive(null);
      state.lostLive = true;
      renderKeepScroll();
    }
  });
}

// 5 s while changes happen or the viewer is active, 30 s after IDLE_MS quiet; visible tab only.
function schedulePoll() {
  clearTimeout(state.pollTimer);
  state.pollTimer = null;
  if (state.source !== "fetch" || document.visibilityState !== "visible") return;
  var idle = Date.now() - state.lastActivity > IDLE_MS;
  state.pollTimer = setTimeout(pollTick, idle ? POLL_SLOW_MS : POLL_FAST_MS);
}
function pollTick() {
  state.pollTimer = null;
  if (state.source !== "fetch" || document.visibilityState !== "visible") return;
  var full = Date.now() - state.lastFull >= SAFETY_MS;
  var jobs = [poll(full, false)];
  if (full) jobs.push(refreshInfo());
  Promise.all(jobs).then(schedulePoll, schedulePoll);
}
// Any click or key press brings the 30 s poll back to 5 s.
function noteActivity() {
  var wasIdle = Date.now() - state.lastActivity > IDLE_MS;
  state.lastActivity = Date.now();
  if (wasIdle && state.source === "fetch" && document.visibilityState === "visible") schedulePoll();
}
function startPolling() {
  state.lastActivity = Date.now();
  state.lastFull = Date.now();
  schedulePoll();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { state.lastActivity = Date.now(); pollTick(); }
    else { clearTimeout(state.pollTimer); state.pollTimer = null; }
  });
  document.addEventListener("click", noteActivity, true);
  document.addEventListener("keydown", noteActivity, true);
}

/* ---------------- export and reset ---------------- */

// The original tickets.json with overlay statuses applied. Preview tickets, checklist ticks
// and local Pass/Fail clicks are never written: user_checks in the file stay authoritative.
function mergedJson() {
  var out = JSON.parse(JSON.stringify(state.raw));
  var savedIds = {};
  (out.tickets || []).forEach(function (t) { savedIds[t.id] = true; });
  (out.tickets || []).forEach(function (t) {
    var o = state.overlay[t.id];
    if (o && o.status && useOverlay()) t.status = o.status;
    if (!Array.isArray(t.unlocks) && state.byId[t.id]) {
      t.unlocks = state.byId[t.id].unlocks.filter(function (x) { return savedIds[x]; });
    }
  });
  return JSON.stringify(out, null, 2) + "\n";
}

function download(name, text) {
  var blob = new Blob([text], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ---------------- theme ---------------- */

function applyTheme(mode) {
  if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* ignore */ }
}

/* ---------------- wiring ---------------- */

function typingIn() {
  var tag = document.activeElement ? document.activeElement.tagName : "";
  return /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
}

function wire() {
  $("#viewBoard").addEventListener("click", function () { state.view = "board"; render(); });
  $("#viewOrder").addEventListener("click", function () { state.view = "order"; render(); });

  $("#search").addEventListener("input", function (e) {
    state.search = e.target.value.trim().toLowerCase();
    render();
  });
  $("#sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });
  $("#fReady").addEventListener("change", function (e) { state.readyOnly = e.target.checked; render(); });
  $("#fHideDone").addEventListener("change", function (e) { state.hideDone = e.target.checked; render(); });

  $("#clearFilters").addEventListener("click", function () {
    state.filters = { phase: [], area: [], priority: [], status: [] };
    state.readyOnly = false;
    state.hideDone = false;
    $("#fReady").checked = false;
    $("#fHideDone").checked = false;
    render();
  });

  $("#exportBtn").addEventListener("click", function () {
    if (!state.raw) return;
    download("tickets.json", mergedJson());
  });

  $("#resetBtn").addEventListener("click", function () {
    if (!changeCount() || window.confirm("Discard all local status changes, checklist ticks and Pass/Fail clicks?")) {
      state.overlay = {};
      saveOverlay();
      render();
    }
  });

  var themes = ["auto", "light", "dark"];
  $("#themeBtn").addEventListener("click", function () {
    var cur = "auto";
    try { cur = localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { /* ignore */ }
    var nextTheme = themes[(themes.indexOf(cur) + 1) % themes.length];
    applyTheme(nextTheme);
    $("#themeBtn").textContent = "Theme: " + nextTheme;
  });

  $("#copyCmdsBtn").addEventListener("click", copyCommands);
  $("#removedBtn").addEventListener("click", removedPanel);
  $("#historyBtn").addEventListener("click", historyPanel);

  document.addEventListener("keydown", function (e) {
    if (modalOpen()) {
      if (e.key === "Escape") cancelModal();
      return;
    }
    if (e.key === "Escape" && state.openId) { closeDrawer(); return; }
    if (state.openId && !typingIn() && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      var b = $(e.key === "ArrowLeft" ? "#drawerPrev" : "#drawerNext");
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
      return;
    }
    if (e.key === "/" && !typingIn()) {
      e.preventDefault();
      $("#search").focus();
      $("#search").select();
    }
  });

  document.addEventListener("click", function (e) {
    var open = document.querySelectorAll("details.fd[open]");
    for (var i = 0; i < open.length; i++) {
      if (!open[i].contains(e.target)) open[i].removeAttribute("open");
    }
  });
}

/* ---------------- boot ---------------- */

function isPreviewDoc(v) { return !!(v && typeof v === "object" && v.preview === true && Array.isArray(v.tickets)); }

function showLoader(message) {
  var rows = document.querySelectorAll("header .hrow");
  if (rows[1]) rows[1].style.display = "none";

  var root = $("#main");
  root.innerHTML = "";
  var box = el("div", "loader");
  box.appendChild(el("h2", null, "Could not load tickets.json"));

  var p = el("p");
  p.innerHTML = "This page reads <code>./tickets.json</code> from its own folder. Serve the folder with "
    + "<code>python3 -m http.server 8088</code> and open <code>http://localhost:8088</code>, "
    + "or pick the file below to load it directly. You can pick <code>preview.json</code> "
    + "together with it to see a preview.";
  box.appendChild(p);

  var inp = el("input");
  inp.type = "file";
  inp.multiple = true;
  inp.accept = ".json,application/json";
  inp.addEventListener("change", function () {
    var files = Array.prototype.slice.call(inp.files || []);
    if (!files.length) return;
    var results = [], left = files.length, failed = false;
    files.forEach(function (f, idx) {
      var fr = new FileReader();
      fr.onload = function () {
        try { results[idx] = JSON.parse(String(fr.result)); }
        catch (err) {
          failed = true;
          box.appendChild(el("div", "err", f.name + " is not valid JSON: " + err.message));
        }
        if (--left === 0 && !failed) {
          var board = results.filter(function (r) { return !isPreviewDoc(r); })[0];
          var pv = results.filter(isPreviewDoc)[0] || null;
          if (!board) { box.appendChild(el("div", "err", "Pick tickets.json too (preview.json alone is not a board).")); return; }
          state.source = "file";   // picked files can't be re-read, so no live refresh
          boot(board, pv);
        }
      };
      fr.readAsText(f);
    });
  });
  box.appendChild(inp);
  if (message) box.appendChild(el("div", "err", "Reason: " + message));
  root.appendChild(box);
}

function setTitle(meta) {
  var proj = meta.project || "Slate board";
  document.title = meta.project ? proj + " board" : proj;
  $("#brandName").textContent = proj;
}

function boot(data, preview) {
  var rows = document.querySelectorAll("header .hrow");
  for (var i = 0; i < rows.length; i++) rows[i].style.display = "";
  var meta = (data && data.meta) || {};
  var prefix = String(meta.prefix || "board");
  OVERLAY_KEY = "slate." + prefix + ".overlay.v1";
  state.overlay = loadOverlay();
  normalise(data || {}, isPreviewDoc(preview) ? preview : null);
  pruneOverlay();
  setTitle(meta);
  render();
}

(function init() {
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved) { applyTheme(saved); $("#themeBtn").textContent = "Theme: " + saved; }
  } catch (e) { /* ignore */ }
  wire();
  var infoP = readInfo();
  fetch(TICKETS_URL, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var lm = r.headers.get("Last-Modified");
      return r.text().then(function (tt) { return { tt: tt, lm: lm }; });
    })
    .then(function (res) {
      var data = JSON.parse(res.tt);
      return Promise.all([fetchCond(PREVIEW_URL, true), infoP]).then(function (more) {
        var p = more[0], pt = p.kind === "ok" ? p.text : null, pv = null;
        if (pt) { try { pv = JSON.parse(pt); } catch (e) { pv = null; } }
        setLive(more[1]);
        state.source = "fetch";
        state.lastSig = res.tt + "\u0000" + (pt || "");
        state.lastText = { t: res.tt, p: pt };
        if (res.lm) state.lastMod[TICKETS_URL] = res.lm;
        if (p.kind === "ok" && p.lm) state.lastMod[PREVIEW_URL] = p.lm;
        boot(data, pv);
        loadAllowed();
        if (!state.live) refreshInfo();
        startPolling();
      });
    })
    .catch(function (err) { showLoader(String(err && err.message ? err.message : err)); });
})();
</script>
</body>
